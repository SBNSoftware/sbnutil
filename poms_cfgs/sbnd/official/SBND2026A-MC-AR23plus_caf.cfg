# =============================================================================
# SBND2026A-MC-AR23plus_caf.cfg
#
# POMS config for the AR23+ CAF reprocessing campaign:
#   [caf files (SAM input)] --> UpdateReweight (sbnnusyst) --> flatcaf
#
# Single stage ("sbnnusyst"): the sbnnusyst UpdateReweight executable reads a
# list of input CAF files (xrootd URIs in input.list) and writes one flatcaf
# (output.root) with the AR23+ interaction systematics added.
#
# Modelled on:
#   /exp/sbnd/app/users/sbndpro/mcp/SBND2026A/srcs/sbnutil/poms_cfgs/sbnd/official/SBND2026A-DATA-reco2_caf.cfg
#
# HOW INPUT HANDLING WORKS (fife_wrap multifile mode):
#   - fife_wrap establishes the SAM consumer (delivery limit =
#     n_files_per_job, see [sam_consumer]) and enters its file loop.
#   - job_setup.mix (mix_sbnnusyst.sh) runs after the first file is
#     delivered: it appends that file's xrootd URI to input.list and then
#     DRAINS the rest of the SAM queue into input.list (marking those files
#     'transferred'). The file loop therefore makes exactly ONE pass and
#     UpdateReweight runs exactly ONCE over the full list.
#   - metadata_postscripts_sbnnusyst.sh renames output.root to a unique
#     hashed flatcaf name, builds SAM metadata with ALL input cafs as
#     parents, copies to dCache, declares, and marks the drained inputs
#     'consumed' (fife_wrap handles the first file itself).
#
#   NOTE (verified in fife_wrap source, v3_7_6, and in a real job): in
#   multifile mode fife_wrap appends the fetched name of the current (first)
#   input file to the end of the first executable's command line, and
#   UpdateReweight's strict argument parser exits with usage on any unknown
#   argument. The executable is therefore the run_sbnnusyst.sh wrapper,
#   which swallows the extra argument and runs UpdateReweight itself.
# =============================================================================

[global]
wrapper=file:///${FIFE_UTILS_DIR}/libexec/fife_wrap
experiment=sbnd
group=%(experiment)s

# exp_sw / version / quals for sbnnusyst
# (make sure the POMS campaign parameters agree with these!)
exp_sw=sbnnusyst
version=v1_00_01
quals=e26:G3J05P3:prof
basename=stage_override

merge_streamname=merge_only
data_tier=flat_caf
nevents=-1

# Number of input caf files consumed per job (100 to 500 is sensible).
# This is also used as the SAM consumer delivery limit -- see [sam_consumer].
n_files_per_job=100

configuration=override_me
project_stage=override_me
campaign=override_me
productionlabel = SBND2026A
mdprojectstage=override_me
prodtype=mc
basedir=/pnfs/sbn/data_add/sbn_nd/poms_production/
#basedir=/pnfs/sbnd/scratch/sbndpro/poms_production/test/
outbase=%(basedir)s/%(prodtype)s/%(productionlabel)s/%(version)s/%(campaign)s/

# Declare base dataset -- set in the POMS campaign
sam_dataset=override_me

# One stage, one fcl: the AR23+ knobs ParamHeader fcl fed to UpdateReweight.
# No fclfile wrappers are needed (UpdateReweight is not an art executable).
# The fcl is expected to be found via FHICL_FILE_PATH after the sbnnusyst
# setup; if it is not part of the product, ship it via an f_N dropbox line in
# [submit] (CONDOR_DIR_INPUT is prepended to FHICL_FILE_PATH in prescript).
fclfile1 = Ar23+_knobs.ParamHeader.fcl

# fcl_list is embedded in the output metadata (fcl.name) for traceability
fcl_list = %(fclfile1)s

# Labels used for output naming / dataset tags (sanitised: no '+')
fclname = AR23plus_knobs
sample  = CV

[env_pass]
IFDH_DEBUG=0
SAM_EXPERIMENT=%(experiment)s
SAM_GROUP=%(group)s
SAM_STATION=%(experiment)s
# xrootd resilience -- inputs are streamed, not copied
XRD_CONNECTIONRETRY=32
XRD_REQUESTTIMEOUT=14400
XRD_REDIRECTLIMIT=255
XRD_LOADBALANCERTTL=7200
XRD_STREAMTIMEOUT=7200
IFDH_CP_MAXRETRIES=3

[prelaunch]
script = mkdir -p %(outbase)s

[submit]
G=%(group)s
N=-1
resource-provides=usage_model=OPPORTUNISTIC,DEDICATED,OFFSITE
generate-email-summary=True
expected-lifetime=8h
memory=4000MB
# Singularity + blacklist
line='+SingularityImage=\"/cvmfs/singularity.opensciencegrid.org/fermilab/fnal-wn-sl7:latest\"'
append_condor_requirements_0='(TARGET.HAS_SINGULARITY=?=true)'
append_condor_requirements_1='(TARGET.GLIDEIN_Site\ isnt\ \"RAL\")'
append_condor_requirements_2='(TARGET.GLIDEIN_Site\ isnt\ \"NotreDame\")'
append_condor_requirements_3='(TARGET.GLIDEIN_Site\ isnt\ \"SU-ITS\")'
auth-methods=token

# set a safety to not overload the grid
maxConcurrent = 1000

n_files_per_job=%(n_files_per_job)s
dataset=%(sam_dataset)s

# The scripts written for AR23+ processing:
f_1 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/SBND2026A/srcs/sbnutil/scripts/sbnd/metadata_prescripts_sbnnusyst.sh
f_2 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/SBND2026A/srcs/sbnutil/scripts/sbnd/mix_sbnnusyst.sh
f_3 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/SBND2026A/srcs/sbnutil/scripts/sbnd/metadata_postscripts_sbnnusyst.sh
# Fallback wrapper in case UpdateReweight chokes on the trailing filename
# fife_wrap appends (see CAVEAT in the header):
#f_4 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/SBND2026A/srcs/sbnutil/scripts/sbnd/run_sbnnusyst.sh
#f_4 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/SBND2026A/srcs/sbnutil/scripts/sbnd/pipe_out_file_path.sh
# If Ar23+_knobs.ParamHeader.fcl is not shipped with the sbnnusyst product,
# uncomment and point at a copy of the fcl:
#f_5 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/SBND2026A/srcs/sbnutil/scripts/sbnd/Ar23+_knobs.ParamHeader.fcl
# Prescript to get input as a prescript
f_6 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/SBND2026A/srcs/sbnutil/scripts/sbnd/sbnnusyst_inputlist_maker.sh

# Auto-release stuff.
lines_2                = '+FERMIHTC_AutoRelease=True'
lines_3                = '+FERMIHTC_GraceMemory=4000'
lines_4                = '+FERMIHTC_GraceLifetime=3600'

[job_setup]
debug=True
find_setups=False
source_1=/cvmfs/%(experiment)s.opensciencegrid.org/products/%(experiment)s/setup_%(experiment)s.sh
setup_0=sbnutil
# the sbnnusyst setup handles everything UpdateReweight needs
setup_1=%(exp_sw)s %(version)s -q %(quals)s
# samweb is needed by the postscript and is NOT pulled in by sbnnusyst
setup_2=sam_web_client

#see https://cdcvs.fnal.gov/redmine/projects/fife_utils/wiki/Fife_launchfile_wrap
multifile=False
getconfig=True
# ifdh_art must be False: UpdateReweight is not an art executable, and
# ifdh_art=True would make fife_wrap pass --sam-web-uri/--sam-process-id to it.
ifdh_art=False
setup_local=True

# Convenience prescript so files in CONDOR_DIR_INPUT can be found via fhicl -- harmless, leave here
prescript = export FHICL_FILE_PATH=${CONDOR_DIR_INPUT}:${FHICL_FILE_PATH}
# metadata_prescripts_sbnnusyst.sh (tweaked from metadata_prescripts.sh, no
# arguments): exports the env variables (my_cpurl etc.) needed by the mix and
# postscript for input-file handling, and initialises input.list.
prescript_1 = . ${CONDOR_DIR_INPUT}/metadata_prescripts_sbnnusyst.sh
# No fcl wrappers needed for UpdateReweight:
#prescript_2 = sh sbnpoms_wrapperfclmaker.sh ...
# No art metadata injection needed (metadata built entirely by the postscript):
#prescript_3 = sh sbndpoms_metadata_injector.sh ...
#prescript_4 = source /cvmfs/larsoft.opensciencegrid.org/products/setup
# v2_7_2 was current when the reference cfg was written; ifdh cp/mkdir_p to
# the token-auth dCache doors misbehaved with it (Jul 2026), v2_8_0 works
prescript_5 = setup ifdhc v2_8_0 -q e26:p3915:prof
prescript_6 = export MT_PRODUCTIONNAME=%(campaign)s && export MT_PRODUCTIONTYPE=%(prodtype)s && export MT_PROJECTNAME=%(experiment)s_%(project_stage)s_%(prodtype)s && export MT_PROJECTSTAGE=%(project_stage)s && export MT_PROJECTSOFTWARE=%(exp_sw)s && export MT_PRODUCTIONLABEL=%(productionlabel)s && export MT_PROJECTVERSION=%(version)s && export MT_FCLNAME=%(fclname)s && export MT_SAMPLE=%(sample)s
prescript_7 = export IFDH_OUTPUT_DIR=%(outbase)s && echo "IFDH_OUTPUT_DIR is ${IFDH_OUTPUT_DIR}"

# Dump environment -- useful diagnostic
prescript_8 = echo && echo && ups active && echo && echo

# Copy the list maker to working directory. CONDOR_DIR_INPUT seems to not resolve in executable...
prescript_9 = cp ${CONDOR_DIR_INPUT}/sbnnusyst_inputlist_maker.sh .

# Postscripts: These run every time after the executable... So multiple times, if passing multifile
# or get_config.
# no wrappers and no empty files expected, so rm_empty_files.sh calls dropped
#postscript_1 = . ${CONDOR_DIR_INPUT}/rm_empty_files.sh ...
# Making a postscript that actually runs UpdateReweight. Yes it's weird. No I don't have a better idea.
# postscript_2 = UpdateReweight -c %(fclfile1)s -i input.list -o output.root > /dev/null
# build_event_numbers.sh not needed
#postscript_3 = . ${CONDOR_DIR_INPUT}/build_event_numbers.sh ...
postscript_4 = ls -ltrh
# bespoke metadata postscript for the sbnnusyst stage
postscript_5 = . ${CONDOR_DIR_INPUT}/metadata_postscripts_sbnnusyst.sh %(fcl_list)s

# SAM consumer delivery limit must match n_files_per_job, otherwise SAM stops
# serving after 1 file is done.
[sam_consumer]
limit=%(n_files_per_job)s
appname=sbnnusyst
appvers=%(version)s
schema=root

# This executable will build the input.list
[executable]
name  = bash
arg_1 = sbnnusyst_inputlist_maker.sh

# This executable will run UpdateReweight
[executable_2]
name  = UpdateReweight
arg_1 = -c
arg_2 = %(fclfile1)s
arg_3 = -i
arg_4 = input.list
arg_5 = -o
arg_6 = output.root
exe_stdout = /dev/null

# All file delivery is handled in the postscript, so addoutput/rename stay empty
[job_output]
addoutput=
rename=
dest=%(outbase)s/%(basename)s
declare_metadata=True
metadata_extractor=json
add_location=True
hash=0
filter_metadata=rootout
filter_metadata_1=art.first_event
filter_metadata_2=art.last_event
add_to_dataset=_poms_task

[stage_sbnnusyst]
global.basename      = mc_reprocessed
global.project_stage = sbnnusyst

# Leave addoutput empty, all the ifdh calls are handled in the postscript...
job_output.addoutput=
job_output.metadata_extractor=json
job_output.rename=
