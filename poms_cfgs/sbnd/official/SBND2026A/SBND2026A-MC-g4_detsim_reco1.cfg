# =============================================================================
# SBND2026A-MC-g4_detsim_reco1.cfg
#
# POMS config for the FIRST half of a two-release MC chain, starting from
# pre-generated gen-tier artroot files (e.g. GiBUU fake data):
#   [gen artroot (SAM input)] --> g4 --> detsim --> reco1
#
# The second half (reco2 --> caf) runs in a separate stage with a different
# sbndcode version, using SBND2026A-MC-reco2_caf.cfg on the reco1 files
# declared here.
#
# PIPELINE:
#   executable   (wrapper1): g4     -- reads SAM artroot input, produces g4.root
#   executable_1 (wrapper2): detsim -- reads g4.root, produces g4_detsim.root
#   executable_2 (wrapper3): reco1  -- reads g4_detsim.root, produces g4_detsim_reco1.root
#                                      also produces larcv*.root as a secondary stream
#
# Files saved (all declared to SAMWeb, copied to dCache):
#   - reco1  g4_detsim_reco1.root  (always -- it is the input to the reco2_caf stage)
#   - larcv  larcv*.root           (conditional: SAVE_LARCV=1)
#   g4 and detsim intermediates are never saved (always discarded).
#
# Adapted from:
#   SBND2026A-MC-scrub_g4_detsim_reco1_reco2_caf.cfg  (SAM artroot input, g4/detsim/reco1 executables)
#   SBND2026A-MC-wiremod_larcv_NERSC.cfg              (metadata injection on a stage with no CAF)
# =============================================================================

[global]
group      = sbnd
experiment = sbnd
sbndpro    = sbndpro
wrapper    = file:///${FIFE_UTILS_DIR}/libexec/fife_wrap
# Set per campaign stage in POMS (e.g. v10_06_00_02 / e26:prof)
version    = campaign_override
quals      = campaign_override

neventsperjob = -1

# Three fcl files: one per executable
fclfile1 = override_me  # g4
fclfile2 = override_me  # detsim
fclfile3 = override_me  # reco1

# fcl_list is embedded in output metadata so outputs are always traceable
fcl_list = override_me

# Wrapper fcls are built on-the-fly
wrapper1 = wrapper1.fcl
wrapper2 = wrapper2.fcl
wrapper3 = wrapper3.fcl

productionlabel        = SBND2026A
mdprojectstage         = g4_detsim_reco1
mdproductiontype       = official
productiontype         = mc
test_productiontype    = test_%(productiontype)s
mdproductionname       = %(productionlabel)s
test_mdproductionname  = test_%(productionlabel)s
sample                 = CV
mdfirststage           = g4
mdlaststage            = reco1
fclname                = override_me
basename               = %(mdproductiontype)s
outputdataset          = %(productiontype)s_%(mdproductionname)s_%(version)s_%(fclname)s_%(sample)s
outputdatasetname      = %(outputdataset)s
base                   = /pnfs/sbn/data_add/sbn_nd/poms_production/
test_base              = /pnfs/sbn/scratch/users/sbndpro/poms_production/
basedir                = %(base)s/%(productiontype)s/%(productionlabel)s/%(version)s/%(fclname)s/%(sample)s/
outdir                 = %(basedir)s
project_name           = g4_detsim_reco1_MC

sam_dataset = override_me

[env_pass]
SAM_EXPERIMENT      = %(experiment)s
SAM_GROUP           = %(group)s
SAM_STATION         = %(experiment)s
XRD_CONNECTIONRETRY = 32
XRD_REQUESTTIMEOUT  = 14400
XRD_REDIRECTLIMIT   = 255
XRD_LOADBALANCERTTL = 7200
XRD_STREAMTIMEOUT   = 7200
IFDH_CP_MAXRETRIES  = 3
IFDH_DEBUG          = 1
# On/off switch for the larcv output (1=save to dCache+SAMWeb, 0=skip).
# reco1 has no switch: the reco2_caf stage needs it as input.
SAVE_LARCV          = 1

[prelaunch]
script = mkdir -p %(basedir)s

[submit]
group             = %(group)s
subgroup          = standard
role              = production
resource-provides = usage_model=OPPORTUNISTIC,DEDICATED,OFFSITE
expected-lifetime = 4h
memory            = 3000MB
N                 = -1
n_files_per_job   = 1
append_condor_requirements = '(TARGET.HAS_CVMFS_sbnd_opensciencegrid_org==true)&&(TARGET.HAS_SINGULARITY=?=true)'
lines_1           = '+SingularityImage=\"/cvmfs/singularity.opensciencegrid.org/fermilab/fnal-wn-sl7:latest\"'
lines_2           = '+FERMIHTC_AutoRelease=True'
lines_3           = '+FERMIHTC_GraceMemory=6000'
lines_4           = '+FERMIHTC_GraceLifetime=3600'
blacklist         = SLATE_US_NMSU_DISCOVERY
cpu               = 1
maxConcurrent     = 1000

# f_1: metadata_prescripts.sh -- sets PARENT_FILE_SAM to the SAM-delivered gen
#      input file and builds wrapper1.fcl from fclfile1 (the g4 FCL).
# f_2: our postscript -- renames files with unique hashes, builds SAMWeb JSON
#      metadata, declares files, and copies them to dCache.
f_1 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/SBND2026A/srcs/sbnutil/scripts/sbnd/metadata_prescripts.sh
f_2 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/SBND2026A/srcs/sbnutil/scripts/sbnd/metadata_postscripts_MC_g4_detsim_reco1.sh

[sam_consumer]
limit     = 1
schema    = root
appfamily = art
appname   = %(mdprojectstage)s
appvers   = %(version)s

[job_setup]
debug     = True
# ifdh_art=True: the SAM artroot input is delivered to the first executable (g4),
# which therefore has no -s argument. Same mode as the scrub and wiremod workflows.
ifdh_art  = True
multifile = False
source    = /cvmfs/sbnd.opensciencegrid.org/products/sbnd/setup_sbnd.sh
setup_0   = sbndcode %(version)s -q %(quals)s
setup_1   = -t sbnutil

prescript   = source /cvmfs/sbnd.opensciencegrid.org/products/sbnd/setup_sbnd.sh
prescript_1 = ups active
prescript_2 = export FHICL_FILE_PATH=${CONDOR_DIR_INPUT}:${FHICL_FILE_PATH} && export WORKDIR=${PWD} && export FHICL_FILE_PATH=${WORKDIR}:${FHICL_FILE_PATH}

# KEY: metadata_prescripts.sh is called with fclfile1 (the g4 FCL) and wrapper1.
#   - Builds wrapper1.fcl from the g4 FCL
#   - Sets PARENT_FILE_SAM to the SAM-delivered gen artroot file (basename only)
prescript_3 = . ${CONDOR_DIR_INPUT}/metadata_prescripts.sh %(fclfile1)s %(wrapper1)s

# Export production metadata variables used by the postscript
prescript_4 = export MT_PRODUCTIONNAME=%(sample)s && export MT_PRODUCTIONTYPE=%(productiontype)s && export MT_PROJECTNAME=%(mdproductionname)s && export MT_PROJECTSTAGE=%(mdprojectstage)s && export MT_PROJECTSOFTWARE=sbndcode && export MT_PRODUCTIONLABEL=%(productionlabel)s && export MT_EVENTS_PER_JOB=%(neventsperjob)s && export MT_SAMPLE=%(sample)s && export MT_FCLNAME=%(fclname)s
prescript_5 = export IFDH_OUTPUT_DIR=%(basedir)s && echo "IFDH_OUTPUT_DIR is ${IFDH_OUTPUT_DIR}"

# Build wrapper FCLs for stages 2-3 (wrapper1 was built by metadata_prescripts.sh)
prescript_6 = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile2)s --wrappername wrapper2.fcl
prescript_7 = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile3)s --wrappername wrapper3.fcl

# Inject metadata into the reco1 wrapper (wrapper3 = last stage).
# --tfilemdjsonname: JSON sidecar the postscript reads event_count from.
# No --cafname: this stage makes no CAF (same as SBND2026A-MC-wiremod_larcv_NERSC.cfg).
prescript_8 = sbnpoms_metadata_injector.sh --inputfclname wrapper3.fcl --mdappfamily art --mdappversion %(version)s --mdgroupname sbnd --mdfiletype mc --mdruntype physics --mdfclname %(fclfile1)s/%(fclfile2)s/%(fclfile3)s --mdprojectname %(project_name)s --mdprojectstage %(mdprojectstage)s --mdprojectversion %(version)s --mdprojectsoftware sbndcode --mdproductionname %(mdproductionname)s --mdproductiontype %(mdproductiontype)s --tfilemdjsonname hist_%(mdprojectstage)s.root.json

postscript   = ls -ltrh
# Postscript handles renaming, JSON metadata, SAMWeb declaration, ifdh copy.
# SAVE_LARCV (from env_pass) controls whether larcv is saved.
postscript_1 = . ${CONDOR_DIR_INPUT}/metadata_postscripts_MC_g4_detsim_reco1.sh %(fcl_list)s


# Default placeholder executables -- loud failure if not overridden in stage
[executable]
name  = echo
arg_1 = "YOU HAVE NOT SET EXECUTABLE 1 (g4). GO FIX THIS IN THE [stage] BLOCK."

[executable_1]
name  = echo
arg_1 = "YOU HAVE NOT SET EXECUTABLE 2 (detsim). GO FIX THIS IN THE [stage] BLOCK."

[executable_2]
name  = echo
arg_1 = "YOU HAVE NOT SET EXECUTABLE 3 (reco1). GO FIX THIS IN THE [stage] BLOCK."


# All file delivery is handled in the postscript, so addoutput/rename stay empty
[job_output]
addoutput          =
rename             =
dest               = %(basedir)s/%(basename)s
declare_metadata   = True
metadata_extractor = json
add_location       = True
hash               = 0
filter_metadata    = rootout
filter_metadata_1  = art.first_event
filter_metadata_2  = art.last_event
add_to_dataset     = _poms_task


[stage_g4_detsim_reco1]
global.basename        = official
global.mdprojectstage  = g4_detsim_reco1
global.mdfirststage    = g4
global.mdlaststage     = reco1

# Empty -- all ifdh calls handled in postscript
job_output.addoutput          =
job_output.metadata_extractor = json
job_output.rename             =

# Executable 0: g4
# Reads the SAM-delivered gen artroot input (no -s: ifdh_art supplies it).
# -n is neventsperjob (set in POMS, e.g. 50): a cap on events taken from each
# input file. The default -1 processes every event. detsim/reco1 then process
# all g4 output (-n -1).
# Output: g4.root (intermediate -- fed to detsim, discarded after)
executable.name    = lar
executable.arg_1   = -c
executable.arg_2   = wrapper1.fcl
executable.arg_3   = -o
executable.arg_4   = g4.root
executable.arg_5   = -T
executable.arg_6   = hist_g4.root
executable.arg_7   = -n
executable.arg_8   = %(neventsperjob)s
executable.arg_9   = --sam-data-tier
executable.arg_10  = simulated
executable.arg_11  = --sam-stream-name
executable.arg_12  = out1

# Executable 1: detsim
# Reads g4.root, outputs g4_detsim.root (intermediate -- discarded after reco1)
executable_1.name    = lar
executable_1.arg_1   = -c
executable_1.arg_2   = wrapper2.fcl
executable_1.arg_3   = -o
executable_1.arg_4   = g4_detsim.root
executable_1.arg_5   = -T
executable_1.arg_6   = hist_g4_detsim.root
executable_1.arg_7   = -n
executable_1.arg_8   = -1
executable_1.arg_9   = --sam-data-tier
executable_1.arg_10  = detector-simulated
executable_1.arg_11  = --sam-stream-name
executable_1.arg_12  = out1
executable_1.arg_13  = -s
executable_1.arg_14  = g4.root

# Executable 2: reco1
# Reads g4_detsim.root, outputs:
#   g4_detsim_reco1.root  -- KEPT (input to the reco2_caf stage)
#   larcv*.root           -- secondary stream, KEPT if SAVE_LARCV=1
executable_2.name    = lar
executable_2.arg_1   = -c
executable_2.arg_2   = wrapper3.fcl
executable_2.arg_3   = -o
executable_2.arg_4   = g4_detsim_reco1.root
executable_2.arg_5   = -T
executable_2.arg_6   = hist_%(mdprojectstage)s.root
executable_2.arg_7   = -n
executable_2.arg_8   = -1
executable_2.arg_9   = --sam-data-tier
executable_2.arg_10  = reconstructed
executable_2.arg_11  = --sam-stream-name
executable_2.arg_12  = out1
executable_2.arg_13  = -s
executable_2.arg_14  = g4_detsim.root

global.fcl_list = %(fclfile1)s/%(fclfile2)s/%(fclfile3)s
