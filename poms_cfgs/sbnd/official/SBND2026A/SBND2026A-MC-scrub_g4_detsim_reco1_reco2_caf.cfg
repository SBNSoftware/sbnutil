# =============================================================================
# SBND2026A-MC-scrub_g4_detsim_reco1_reco2_caf.cfg
#
# POMS config for running the full MC chain starting from a scrub-tier input:
#   [scrub artroot (SAM input)] --> scrub --> g4 --> detsim --> reco1 --> reco2 --> caf
#
# PIPELINE:
#   executable   (wrapper1): scrub   -- reads SAM artroot input, produces scrub.root
#   executable_1 (wrapper2): g4      -- reads scrub.root, produces scrub_g4.root
#   executable_2 (wrapper3): detsim  -- reads scrub_g4.root, produces scrub_g4_detsim.root
#   executable_3 (wrapper4): reco1   -- reads scrub_g4_detsim.root, produces scrub_g4_detsim_reco1.root
#                                       also produces larcv*.root as a secondary stream
#   executable_4 (wrapper5): reco2   -- reads scrub_g4_detsim_reco1.root, produces reco2.root
#                                       also produces hist_scrub_g4_detsim_reco1_reco2_caf.root (KEPT)
#   executable_5 (wrapper6): caf     -- reads reco2.root, produces caf.root + flat.caf.root (KEPT)
#
# Files saved (all declared to SAMWeb, copied to dCache):
#   - reco1        scrub_g4_detsim_reco1.root    (conditional: SAVE_RECO1=1)
#   - larcv        larcv*.root                    (conditional: SAVE_LARCV=1)
#   - calib ntuple hist_scrub_g4_detsim_reco1_reco2_caf.root  (always)
#   - caf          caf.root                       (always)
#   - flatcaf      flat.caf.root                  (always)
#
# ON/OFF SWITCH for reco1 and larcv:
#   Set SAVE_RECO1 and SAVE_LARCV in [env_pass] below (1=save, 0=skip).
#   The postscript reads these env vars and skips the declare/copy for 0-valued files.
#   Scrub, g4, and detsim intermediates are never saved (always discarded).
#
# Adapted from:
#   SBND2026A-MC-reco2_caf.cfg  (base postscript pattern and prescript logic)
#   SBND2026A-MC-gen_g4_detsim_reco1_reco2_caf.cfg  (multi-executable structure, g4 stage)
#   SBND2026A-MC-scrub_detsim_reco1_reco2_caf.cfg  (scrub/detsim/reco1/reco2/caf base)
#   MCP2025B-scrub_detsim_reco1.cfg  (scrub/detsim/reco1 executable pattern)
# =============================================================================

[global]
group      = sbnd
experiment = sbnd
sbndpro    = sbndpro
wrapper    = file:///${FIFE_UTILS_DIR}/libexec/fife_wrap
version    = v09_91_02_01
quals      = e26:prof

neventsperjob = -1

# Six fcl files: one per executable
fclfile1 = override_me  # scrub
fclfile2 = override_me  # g4
fclfile3 = override_me  # detsim
fclfile4 = override_me  # reco1
fclfile5 = override_me  # reco2
fclfile6 = override_me  # caf

# fcl_list is embedded in output metadata so outputs are always traceable
fcl_list = override_me

# Wrapper fcls are built on-the-fly
wrapper1 = wrapper1.fcl
wrapper2 = wrapper2.fcl
wrapper3 = wrapper3.fcl
wrapper4 = wrapper4.fcl
wrapper5 = wrapper5.fcl
wrapper6 = wrapper6.fcl

productionlabel        = SBND2026A
mdprojectstage         = scrub_g4_detsim_reco1_reco2_caf
mdproductiontype       = official
productiontype         = mc
test_productiontype    = test_%(productiontype)s
mdproductionname       = %(productionlabel)s
test_mdproductionname  = test_%(productionlabel)s
sample                 = CV
mdfirststage           = scrub
mdlaststage            = caf
fclname                = override_me
basename               = %(mdproductiontype)s
outputdataset          = %(productiontype)s_%(mdproductionname)s_%(version)s_%(fclname)s_%(sample)s
outputdatasetname      = %(outputdataset)s
base                   = /pnfs/sbn/data_add/sbn_nd/poms_production/
test_base              = /pnfs/sbn/scratch/users/sbndpro/poms_production/
basedir                = %(base)s/%(productiontype)s/%(productionlabel)s/%(version)s/%(fclname)s/%(sample)s/
outdir                 = %(basedir)s
project_name           = scrub_g4_detsim_reco1_reco2_caf_MC

sam_dataset = override_me

[env_pass]
SAM_EXPERIMENT      = %(experiment)s
SAM_GROUP           = %(group)s
SAM_STATION         = %(experiment)s
XRD_CONNECTIONRETRY = 32
XRD_REQUESTTIMEOUT  = 14400
XRD_REDIRECTLIMIT   = 255
XRD_LOADBALANCERTTL = 7200
XRD_STREAMTIMEOUT   = 7200
IFDH_CP_MAXRETRIES  = 3
IFDH_DEBUG          = 1
# On/off switch for optional output types (1=save to dCache+SAMWeb, 0=skip)
# Pending confirmation: these are set to 1 by default.
# Change to 0 here (or override in your POMS campaign) to disable saving.
SAVE_RECO1          = 1
SAVE_LARCV          = 1

[prelaunch]
script = mkdir -p %(basedir)s

[submit]
group             = %(group)s
subgroup          = standard
role              = production
resource-provides = usage_model=OPPORTUNISTIC,DEDICATED,OFFSITE
expected-lifetime = 4h
memory            = 3000MB
N                 = -1
n_files_per_job   = 1
append_condor_requirements = '(TARGET.HAS_CVMFS_sbnd_opensciencegrid_org==true)&&(TARGET.HAS_SINGULARITY=?=true)'
lines_1           = '+SingularityImage=\"/cvmfs/singularity.opensciencegrid.org/fermilab/fnal-wn-sl7:latest\"'
lines_2           = '+FERMIHTC_AutoRelease=True'
lines_3           = '+FERMIHTC_GraceMemory=6000'
lines_4           = '+FERMIHTC_GraceLifetime=3600'
blacklist         = SLATE_US_NMSU_DISCOVERY
cpu               = 1
maxConcurrent     = 1000

# f_1: metadata_prescripts.sh -- sets PARENT_FILE_SAM to the SAM-delivered scrub
#      input file; also extracts MT_SBND_STREAM_NAME and other metadata fields.
#      It also builds wrapper1.fcl from fclfile1 (the scrub FCL).
# f_2: our postscript -- renames files with unique hashes, builds SAMWeb JSON
#      metadata, declares files, and copies them to dCache.
f_1 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/SBND2026A/srcs/sbnutil/scripts/sbnd/metadata_prescripts.sh
f_2 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/SBND2026A/srcs/sbnutil/scripts/sbnd/metadata_postscripts_MC_scrub_detsim_reco1_reco2_caf.sh

[sam_consumer]
limit     = 1
schema    = root
appfamily = art
appname   = %(mdprojectstage)s
appvers   = %(version)s

[job_setup]
debug     = True
# ifdh_art=True: fife_wrap automatically delivers the SAM artroot input file
# and appends -s <file> to the first executable (scrub).
# This is the same mode used in the reco2_caf workflow.
ifdh_art  = True
multifile = False
source    = /cvmfs/sbnd.opensciencegrid.org/products/sbnd/setup_sbnd.sh
setup_0   = sbndcode %(version)s -q %(quals)s
setup_1   = -t sbnutil

prescript   = source /cvmfs/sbnd.opensciencegrid.org/products/sbnd/setup_sbnd.sh
prescript_1 = ups active
prescript_2 = export FHICL_FILE_PATH=${CONDOR_DIR_INPUT}:${FHICL_FILE_PATH} && export WORKDIR=${PWD} && export FHICL_FILE_PATH=${WORKDIR}:${FHICL_FILE_PATH}

# KEY: metadata_prescripts.sh is called with fclfile1 (the scrub FCL) and wrapper1.
#   - Builds wrapper1.fcl from the scrub FCL
#   - Sets PARENT_FILE_SAM to the SAM-delivered artroot input file (basename only)
#   - Extracts metadata from the parent file (MT_SBND_STREAM_NAME, etc.)
#   This is the same pattern as the reco2_caf workflow; here the parent is the
#   scrub-input artroot file rather than a reco1 file.
prescript_3 = . ${CONDOR_DIR_INPUT}/metadata_prescripts.sh %(fclfile1)s %(wrapper1)s

# Export production metadata variables used by the postscript
prescript_4 = export MT_PRODUCTIONNAME=%(sample)s && export MT_PRODUCTIONTYPE=%(productiontype)s && export MT_PROJECTNAME=%(mdproductionname)s && export MT_PROJECTSTAGE=%(mdprojectstage)s && export MT_PROJECTSOFTWARE=sbndcode && export MT_PRODUCTIONLABEL=%(productionlabel)s && export MT_EVENTS_PER_JOB=%(neventsperjob)s && export MT_SAMPLE=%(sample)s && export MT_FCLNAME=%(fclname)s
prescript_5 = export IFDH_OUTPUT_DIR=%(basedir)s && echo "IFDH_OUTPUT_DIR is ${IFDH_OUTPUT_DIR}"

# Build wrapper FCLs for stages 2-6 (wrapper1 was built by metadata_prescripts.sh)
prescript_6  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile2)s --wrappername wrapper2.fcl
prescript_7  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile3)s --wrappername wrapper3.fcl
prescript_8  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile4)s --wrappername wrapper4.fcl
prescript_9  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile5)s --wrappername wrapper5.fcl
prescript_10 = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile6)s --wrappername wrapper6.fcl

# Inject metadata into the caf wrapper (wrapper6 = last stage)
# --tfilemdjsonname: sidecar JSON for the hist_ file (from reco2 -T output)
# --cafname: expected CAF output filename (used by CAFMaker internally)
prescript_11 = sbnpoms_metadata_injector.sh --inputfclname wrapper6.fcl --mdappfamily art --mdappversion %(version)s --mdgroupname sbnd --mdfiletype mc --mdruntype physics --mdfclname %(fclfile1)s/%(fclfile2)s/%(fclfile3)s/%(fclfile4)s/%(fclfile5)s/%(fclfile6)s --mdprojectname %(project_name)s --mdprojectstage %(mdprojectstage)s --mdprojectversion %(version)s --mdprojectsoftware sbndcode --mdproductionname %(mdproductionname)s --mdproductiontype %(mdproductiontype)s --tfilemdjsonname hist_%(mdprojectstage)s.root.json --cafname %(mdlaststage)s.root

postscript   = ls -ltrh
# Postscript handles renaming, JSON metadata, SAMWeb declaration, ifdh copy.
# SAVE_RECO1 and SAVE_LARCV (from env_pass) control whether those types are saved.
postscript_1 = . ${CONDOR_DIR_INPUT}/metadata_postscripts_MC_scrub_detsim_reco1_reco2_caf.sh %(fcl_list)s


# Default placeholder executables -- loud failure if not overridden in stage
[executable]
name  = echo
arg_1 = "YOU HAVE NOT SET EXECUTABLE 1 (scrub). GO FIX THIS IN THE [stage] BLOCK."

[executable_1]
name  = echo
arg_1 = "YOU HAVE NOT SET EXECUTABLE 2 (g4). GO FIX THIS IN THE [stage] BLOCK."

[executable_2]
name  = echo
arg_1 = "YOU HAVE NOT SET EXECUTABLE 3 (detsim). GO FIX THIS IN THE [stage] BLOCK."

[executable_3]
name  = echo
arg_1 = "YOU HAVE NOT SET EXECUTABLE 4 (reco1). GO FIX THIS IN THE [stage] BLOCK."

[executable_4]
name  = echo
arg_1 = "YOU HAVE NOT SET EXECUTABLE 5 (reco2). GO FIX THIS IN THE [stage] BLOCK."

[executable_5]
name  = echo
arg_1 = "YOU HAVE NOT SET EXECUTABLE 6 (caf). GO FIX THIS IN THE [stage] BLOCK."


# All file delivery is handled in the postscript, so addoutput/rename stay empty
[job_output]
addoutput          =
rename             =
dest               = %(basedir)s/%(basename)s
declare_metadata   = True
metadata_extractor = json
add_location       = True
hash               = 0
filter_metadata    = rootout
filter_metadata_1  = art.first_event
filter_metadata_2  = art.last_event
add_to_dataset     = _poms_task


[stage_scrub_g4_detsim_reco1_reco2_caf]
global.basename        = official
global.mdprojectstage  = scrub_g4_detsim_reco1_reco2_caf
global.mdfirststage    = scrub
global.mdlaststage     = caf

# Empty -- all ifdh calls handled in postscript
job_output.addoutput          =
job_output.metadata_extractor = json
job_output.rename             =

# Executable 0: scrub
# Reads the SAM-delivered artroot input (fife_wrap appends -s automatically).
# Output: scrub.root (intermediate -- fed to g4, discarded after)
# hist_scrub.root is also produced but not saved.
executable.name    = lar
executable.arg_1   = -c
executable.arg_2   = wrapper1.fcl
executable.arg_3   = -o
executable.arg_4   = scrub.root
executable.arg_5   = -T
executable.arg_6   = hist_scrub.root
executable.arg_7   = -n
executable.arg_8   = -1
executable.arg_9   = --sam-data-tier
executable.arg_10  = scrub
executable.arg_11  = --sam-stream-name
executable.arg_12  = out1

# Executable 1: g4
# Reads scrub.root, outputs scrub_g4.root (intermediate -- discarded after detsim)
executable_1.name    = lar
executable_1.arg_1   = -c
executable_1.arg_2   = wrapper2.fcl
executable_1.arg_3   = -o
executable_1.arg_4   = scrub_g4.root
executable_1.arg_5   = -T
executable_1.arg_6   = hist_scrub_g4.root
executable_1.arg_7   = -n
executable_1.arg_8   = -1
executable_1.arg_9   = --sam-data-tier
executable_1.arg_10  = simulated
executable_1.arg_11  = --sam-stream-name
executable_1.arg_12  = out1
executable_1.arg_13  = -s
executable_1.arg_14  = scrub.root

# Executable 2: detsim
# Reads scrub_g4.root, outputs scrub_g4_detsim.root (intermediate -- discarded after reco1)
executable_2.name    = lar
executable_2.arg_1   = -c
executable_2.arg_2   = wrapper3.fcl
executable_2.arg_3   = -o
executable_2.arg_4   = scrub_g4_detsim.root
executable_2.arg_5   = -T
executable_2.arg_6   = hist_scrub_g4_detsim.root
executable_2.arg_7   = -n
executable_2.arg_8   = -1
executable_2.arg_9   = --sam-data-tier
executable_2.arg_10  = detector-simulated
executable_2.arg_11  = --sam-stream-name
executable_2.arg_12  = out1
executable_2.arg_13  = -s
executable_2.arg_14  = scrub_g4.root

# Executable 3: reco1
# Reads scrub_g4_detsim.root, outputs:
#   scrub_g4_detsim_reco1.root  -- saved if SAVE_RECO1=1
#   larcv*.root              -- secondary stream, saved if SAVE_LARCV=1
executable_3.name    = lar
executable_3.arg_1   = -c
executable_3.arg_2   = wrapper4.fcl
executable_3.arg_3   = -o
executable_3.arg_4   = scrub_g4_detsim_reco1.root
executable_3.arg_5   = -T
executable_3.arg_6   = hist_scrub_g4_detsim_reco1.root
executable_3.arg_7   = -n
executable_3.arg_8   = -1
executable_3.arg_9   = --sam-data-tier
executable_3.arg_10  = reconstructed
executable_3.arg_11  = --sam-stream-name
executable_3.arg_12  = out1
executable_3.arg_13  = -s
executable_3.arg_14  = scrub_g4_detsim.root

# Executable 4: reco2
# Reads scrub_g4_detsim_reco1.root, outputs:
#   reco2.root                                -- intermediate, fed to caf, discarded after
#   hist_scrub_g4_detsim_reco1_reco2_caf.root   -- KEPT (calib ntuples)
executable_4.name    = lar
executable_4.arg_1   = -c
executable_4.arg_2   = wrapper5.fcl
executable_4.arg_3   = -o
executable_4.arg_4   = reco2.root
executable_4.arg_5   = -T
executable_4.arg_6   = hist_%(mdprojectstage)s.root
executable_4.arg_7   = -n
executable_4.arg_8   = -1
executable_4.arg_9   = --sam-data-tier
executable_4.arg_10  = reconstructed
executable_4.arg_11  = --sam-stream-name
executable_4.arg_12  = out1
executable_4.arg_13  = -s
executable_4.arg_14  = scrub_g4_detsim_reco1.root

# Executable 5: caf
# Reads reco2.root; CAFMaker names its outputs internally based on injected metadata.
# Outputs: caf.root + flat.caf.root  -- both KEPT
executable_5.name    = lar
executable_5.arg_1   = -c
executable_5.arg_2   = wrapper6.fcl
executable_5.arg_3   = -n
executable_5.arg_4   = -1
executable_5.arg_5   = --sam-data-tier
executable_5.arg_6   = reconstructed
executable_5.arg_7   = --sam-stream-name
executable_5.arg_8   = out1
executable_5.arg_9   = -s
executable_5.arg_10  = reco2.root

global.fcl_list = %(fclfile1)s/%(fclfile2)s/%(fclfile3)s/%(fclfile4)s/%(fclfile5)s/%(fclfile6)s
