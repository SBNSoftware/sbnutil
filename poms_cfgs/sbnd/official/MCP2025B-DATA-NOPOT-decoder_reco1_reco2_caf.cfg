[global]
wrapper=file:///${FIFE_UTILS_DIR}/libexec/fife_wrap
experiment=sbnd
group=%(experiment)s
version=campaign_override
quals=campaign_override
basename=stage_override
fclfile=standard_%(basename)s_%(experiment)s.fcl
wrapperfclfile=wrapper_%(fclfile)s
setupwrapperfile = sbnpoms_wrapperfcl_maker.sh
potfclfile=standard_%(basename)s_%(experiment)s.fcl
wrapperpotfclfile=wrapper_%(potfclfile)s
exp_sw=sbndcode
merge_streamname=merge_only
data_tier=root-tuple
stream_name=physics
nevents=500
first_run=1
first_subrun=\${PROCESS}
first_enum=\$\(\(PROCESS*%(nevents)s+1\)\)
first_event=%(first_run)s:%(first_subrun)s:%(first_enum)s
run_number=-1
sam_dataset=override_me

#outbase=/pnfs/sbnd/scratch/sbndpro/keepup_test
configuration=override_me
project_stage=override_me
campaign=override_me
productionlabel = MCP2025B
fcl_list=%(fclfile)s
mdprojectstage=override_me
prodtype=data
#basedir=/pnfs/sbn/data_add/sbn_nd/poms_production/
basedir=/pnfs/sbn/data_add/sbn_nd/poms_production/
#basedir=/pnfs/sbnd/scratch/sbndpro/poms_production/test/
outbase=%(basedir)s/%(prodtype)s/%(productionlabel)s/%(version)s/%(campaign)s/

[env_pass]
IFDH_DEBUG=1
SAM_EXPERIMENT=%(experiment)s
SAM_GROUP=%(group)s
SAM_STATION=%(experiment)s


[submit]
G=%(group)s
N=5
resource-provides=usage_model=OPPORTUNISTIC,DEDICATED,OFFSITE
generate-email-summary=True
#expected-lifetime=3h
#timeout=2h
#OS=SL6
#disk=10GB
#memory=2000MB
line='+SingularityImage=\"/cvmfs/singularity.opensciencegrid.org/fermilab/fnal-wn-sl7:latest\"'
append_condor_requirements_0='(TARGET.HAS_SINGULARITY=?=true)'
append_condor_requirements_1='(TARGET.GLIDEIN_Site\ isnt\ \"RAL\")'
append_condor_requirements_2='(TARGET.GLIDEIN_Site\ isnt\ \"NotreDame\")'
append_condor_requirements_3='(TARGET.GLIDEIN_Site\ isnt\ \"SU-ITS\")'
auth-methods=token

# set a safety to not overload the grid
maxConcurrent = 2000

#tar_file_name=%(tarfile)s
n_files_per_job=1
dataset=%(sam_dataset)s
f_1 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/MCP2025Av3/srcs/sbnutil/scripts/sbnd/sbndpoms_metadata_injector.sh
f_2 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/MCP2025Av3/srcs/sbnutil/scripts/sbnd/metadata_prescripts.sh
f_3 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/MCP2025Av3/srcs/sbnutil/scripts/sbnd/metadata_postscripts.sh
f_4 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/MCP2025Av3/srcs/sbnutil/scripts/sbnd/export_pot_counter.sh
f_5 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/MCP2025Av3/srcs/sbnutil/scripts/sbnd/build_event_numbers.sh
f_9 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/MCP2025Av3/srcs/sbnutil/scripts/sbnd/rm_empty_files.sh

lines_2                = '+FERMIHTC_AutoRelease=True'
lines_3                = '+FERMIHTC_GraceMemory=4000'
lines_4                = '+FERMIHTC_GraceLifetime=3600'

[job_setup]
debug=True
find_setups=False
source_1=/cvmfs/%(experiment)s.opensciencegrid.org/products/%(experiment)s/setup_%(experiment)s.sh
setup_0=sbnutil
setup_1=%(exp_sw)s %(version)s -q %(quals)s
multifile=False
getconfig=False
ifdh_art=True
setup_local=True

prescript = export FHICL_FILE_PATH=${CONDOR_DIR_INPUT}:${FHICL_FILE_PATH}
prescript_1 = echo "~~~~~" && echo "About to run . metadata_prescripts.sh %(fclfile)s %(wrapperfclfile)s"
prescript_2 = . ${CONDOR_DIR_INPUT}/metadata_prescripts.sh %(fclfile)s %(wrapperfclfile)s
prescript_3 = cmd="sh ${CONDOR_DIR_INPUT}/sbndpoms_metadata_injector.sh --inputfclname ${CONDOR_DIR_INPUT}/%(wrapperfclfile)s --mdfclname %(fclfile)s --mdappfamily art --mdappversion %(version)s --mdgroupname %(experiment)s --mdfiletype data --mdruntype physics --experiment %(experiment)s --mdprojectname %(experiment)s_%(project_stage)s_data --mdprojectstage %(project_stage)s --mdprojectversion %(version)s --mdprojectsoftware %(experiment)scode --mdproductionname %(campaign)s --mdproductiontype %(prodtype)s --configuration ${MT_CONFIGURATION} --datastream ${MT_DATASTREAM} --beamType ${MT_BEAMTYPE} --detector ${MT_DETECTOR} --eventCount ${MT_EVENTCOUNT} --random ${MT_RANDOM} --randomRun ${MT_RANDOMRUN}" && echo ${cmd} && eval ${cmd}
prescript_4 = cat ${CONDOR_DIR_INPUT}/%(wrapperfclfile)s
prescript_5 = source /cvmfs/larsoft.opensciencegrid.org/products/setup
prescript_6 = setup ifdhc v2_7_2 -q e26:p3915:prof
prescript_7 = export MT_PRODUCTIONNAME=%(campaign)s && export MT_PRODUCTIONTYPE=%(prodtype)s && export MT_PROJECTNAME=%(experiment)s_%(project_stage)s_data && export MT_PROJECTSTAGE=%(project_stage)s && export MT_PROJECTSOFTWARE=%(experiment)scode && export MT_PRODUCTIONLABEL=%(productionlabel)s

[sam_consumer]
limit=1
appvers=%(version)s
schema=root


[executable]
name=lar
arg_1=-c
arg_2=\$CONDOR_DIR_INPUT/%(wrapperfclfile)s
arg_3=-o
arg_4=%(basename)s_%%ifb.root
arg_5=-T
arg_6=hist_%(basename)s_%%ifb.root
arg_7=-n
arg_8=%(nevents)s

# need this for POT counting in decode. Leave this and executable_3
# We switch this off in this config, so we'll just keep these executables
[executable_2]
name=ls
arg_1=-ltrh

[executable_3]
name=echo

[job_output]
addoutput=
#%(basename)s_*.root
rename=unique
dest=%(outbase)s/%(basename)s
declare_metadata=True
metadata_extractor=sam_metadata_dumper
add_location=True
hash=1
filter_metadata=rootout
filter_metadata_1=art.first_event
filter_metadata_2=art.last_event
add_to_dataset=_poms_task

[job_output_1]
addoutput=hist_%(basename)s_*.root
rename=unique
dest=%(outbase)s/%(basename)s
declare_metadata=True
metadata_extractor=sam_metadata_dumper
hash=1
filter_metadata=rootout
filter_metadata_1=art.first_event
filter_metadata_2=art.last_event
add_to_dataset=_poms_task

# For flat CAFs
#[job_output_2]
#addoutput=*.flat.caf.root
#rename=unique
#dest=%(outbase)s/caf
#declare_metadata=True
#metadata_extractor=json
#hash=1
#filter_metadata=rootout
#filter_metadata_1=art.first_event
#filter_metadata_2=art.last_event
#filter_metadata_3=sbnd.random
#filter_metadata_4=sbnd.random_run
#add_to_dataset=_poms_task

[stage_decode]
global.basename=decoded-raw
global.project_stage=decode
job_setup.prescript=export FHICL_FILE_PATH=${CONDOR_DIR_INPUT}:${FHICL_FILE_PATH}
job_setup.prescript_2= . ${CONDOR_DIR_INPUT}/metadata_prescripts.sh %(fclfile)s %(wrapperfclfile)s %(potfclfile)s %(wrapperpotfclfile)s
job_setup.prescript_8 = export IFDH_OUTPUT_DIR=%(outbase)s/decoded-raw && echo "IFDH_OUTPUT_DIR is ${IFDH_OUTPUT_DIR}"
job_setup.prescript_9 = cat ${CONDOR_DIR_INPUT}/%(wrapperpotfclfile)s
job_setup.prescript_10 = echo "Here are the contents of the condor input ${CONDOR_DIR_INPUT}..." && ls ${CONDOR_DIR_INPUT}
job_setup.prescript_11 = echo "You should have seen the POT wrapper fcl file..."
job_setup.prescript_12 = cp ${CONDOR_DIR_INPUT}/export_pot_counter.sh .

# Leave addoutput empty, all the ifdh calls are handled in postscripts...
job_output.addoutput= 
job_output.metadata_extractor=json
job_output.rename=

executable.arg_3=-o
executable.arg_4=out1:%(basename)s_filtered_%%ifb.root
executable.arg_5=-o
executable.arg_6=out2:%(basename)s_choppy_%%ifb.root

#executable_2.name=lar
#executable_2.arg_1=-c
#executable_2.arg_2=\$CONDOR_DIR_INPUT/%(wrapperpotfclfile)s
#executable_2.arg_3=-o
#executable_2.arg_4=POT_counted.root
#executable_2.arg_5=-s
#executable_2.arg_6=to_count.root

#executable_3.name=.
#executable_3.arg_1=export_pot_counter.sh
#executable_3.arg_2=decode

#job_output.addoutput=%(basename)s_filtered_*.root

# place files containing choppy events into separate directory
job_output.dest=%(outbase)s/%(basename)s/filtered
job_output_1.dest=%(outbase)s/%(basename)s/choppy
job_output_1.addoutput=%(basename)s_choppy_*.root
job_output_1.declare_metadata=False

job_setup.postscript_1 = . ${CONDOR_DIR_INPUT}/rm_empty_files.sh %(wrapperfclfile)s
job_setup.postscript_2 = ls -ltrh
job_setup.postscript_3 = . ${CONDOR_DIR_INPUT}/build_event_numbers.sh
job_setup.postscript_4 = . ${CONDOR_DIR_INPUT}/metadata_postscripts.sh decode

[stage_reco1]
global.basename=reco1
executable.arg_3=-o
executable.arg_4=out1:%(basename)s_filtered_%%ifb.root
executable.arg_5=-o
executable.arg_6=out2:nhit_fail_%(basename)s_%%ifb.root

# Leave addoutput empty, all the ifdh calls are handled in postscripts...
job_output.addoutput= 
job_output.metadata_extractor=json
job_output.rename=

job_setup.prescript_8 = export IFDH_OUTPUT_DIR=%(outbase)s/reco1 && echo "IFDH_OUTPUT_DIR is ${IFDH_OUTPUT_DIR}"
job_setup.prescript_9 = export IFDH_LARCV_OUTPUT_DIR=%(outbase)s/larcv && echo "IFDH_LARCV_OUTPUT_DIR is ${IFDH_LARCV_OUTPUT_DIR}"

job_setup.postscript_1 = . ${CONDOR_DIR_INPUT}/rm_empty_files.sh %(wrapperfclfile)s
job_setup.postscript_2 = ls -ltrh
job_setup.postscript_3 = . ${CONDOR_DIR_INPUT}/metadata_postscripts.sh reco1

[stage_reco2]
global.basename=reco2

job_setup.prescript_8 = export IFDH_OUTPUT_DIR=%(outbase)s/reco2 && echo "IFDH_OUTPUT_DIR is ${IFDH_OUTPUT_DIR}"

# Leave addoutput empty, all the ifdh calls are handled in postscripts...
job_output.addoutput= 
job_output.metadata_extractor=json
job_output.rename=

job_setup.postscript_1 = . ${CONDOR_DIR_INPUT}/rm_empty_files.sh %(wrapperfclfile)s
job_setup.postscript_2 = ls -ltrh
job_setup.postscript_3 = . ${CONDOR_DIR_INPUT}/metadata_postscripts.sh reco2 true

[stage_caf]
global.basename=caf
global.mdprojectstage  = caf
# Leave addoutput empty, all the ifdh calls are handled in postscripts...
job_output.addoutput= 
job_output.metadata_extractor=json
job_output.rename=

job_setup.prescript_8 = export IFDH_OUTPUT_DIR=%(outbase)s/caf && echo "IFDH_OUTPUT_DIR is ${IFDH_OUTPUT_DIR}"
job_setup.prescript_9 = export IFDH_FLAT_OUTPUT_DIR=%(outbase)s/flatcaf && echo "IFDH_FLAT_OUTPUT_DIR is ${IFDH_FLAT_OUTPUT_DIR}"

#job_output.filter_metadata_3=sbnd.random
#job_output.filter_metadata_4=sbnd.random_run
executable.arg_3=
executable.arg_4=

job_setup.postscript_1 = . ${CONDOR_DIR_INPUT}/rm_empty_files.sh %(wrapperfclfile)s
job_setup.postscript_2 = ls -ltrh
job_setup.postscript_3 = . ${CONDOR_DIR_INPUT}/metadata_postscripts.sh caf
