[global]
wrapper=file:///${FIFE_UTILS_DIR}/libexec/fife_wrap
experiment=sbnd
group=%(experiment)s
version=campaign_override
quals=campaign_override
basename=stage_override
setupwrapperfile = sbnpoms_wrapperfcl_maker.sh
exp_sw=sbndcode
merge_streamname=merge_only
data_tier=root-tuple
data_stream=override_me
nevents=500

#outbase=/pnfs/sbnd/scratch/sbndpro/keepup_test
configuration=override_me
project_name=override_me
project_stage=override_me
campaign=override_me
productionlabel = MCP2025C
mdprojectstage=override_me
prodtype=data
#basedir=/pnfs/sbn/data_add/sbn_nd/poms_production/
basedir=/pnfs/sbn/data_add/sbn_nd/poms_production/
#basedir=/pnfs/sbnd/scratch/sbndpro/poms_production/test/
outbase=%(basedir)s/%(prodtype)s/%(productionlabel)s/%(version)s/%(campaign)s/

# Declare base dataset -- we'll add stream name and software version in add_output
sam_dataset=override_me

# 1 fcl file per stage
fclfile1 = override_me
fclfile2 = override_me
fclfile3 = override_me
fclfile4 = override_me
wrapper1 = wrapper1.fcl
wrapper2 = wrapper2.fcl
wrapper3 = wrapper3.fcl
wrapper4 = wrapper4.fcl
# POT fcl file
potfclfile = override_me
wrapperpot = wrapper_pot.fcl
# Extra fcl files, for additional stuff
extrafclfile1 = override_me
extrafclfile2 = override_me
extrafclfile3 = override_me
extrafclfile4 = override_me
wrapperextra1 = wrapper_extra1.fcl
wrapperextra2 = wrapper_extra2.fcl
wrapperextra3 = wrapper_extra3.fcl
wrapperextra4 = wrapper_extra4.fcl

# You should set fcl_list to be all the fcls you expect to run.
# Set this in stage, there should be one fcl per lar executable
fcl_list = override_me

[env_pass]
IFDH_DEBUG=1
SAM_EXPERIMENT=%(experiment)s
SAM_GROUP=%(group)s
SAM_STATION=%(experiment)s


[submit]
G=%(group)s
# "pro" to only access SBND slots, but have access to 2.8k slots as opposed to the ~1k standard slots
# 1 slot == 2000MB mem
subgroup=standard
N=5
resource-provides=usage_model=OPPORTUNISTIC,DEDICATED,OFFSITE
# resource-provides=usage_model=OPPORTUNISTIC,DEDICATED
generate-email-summary=True
# Singularity + blacklist
line='+SingularityImage=\"/cvmfs/singularity.opensciencegrid.org/fermilab/fnal-wn-sl7:latest\"'
append_condor_requirements_0='(TARGET.HAS_SINGULARITY=?=true)'
# also check `--blocklist RAL,NotreDame,SU-ITS` according to Vito
append_condor_requirements_1='(TARGET.GLIDEIN_Site\ isnt\ \"RAL\")'
append_condor_requirements_2='(TARGET.GLIDEIN_Site\ isnt\ \"NotreDame\")'
append_condor_requirements_3='(TARGET.GLIDEIN_Site\ isnt\ \"SU-ITS\")'
auth-methods=token

# set a safety to not overload the grid
maxConcurrent = 2000

n_files_per_job=1
dataset=%(sam_dataset)s
# These are necessary files, we get from app.
# Should work to get these from sbnutil once the PR is merged...
f_1 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/MCP2025B/srcs/sbnutil/scripts/sbnd/sbndpoms_metadata_injector.sh
f_2 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/MCP2025B/srcs/sbnutil/scripts/sbnd/metadata_prescripts.sh
f_3 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/MCP2025B/srcs/sbnutil/scripts/sbnd/metadata_postscripts_onestage.sh
f_4 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/MCP2025B/srcs/sbnutil/scripts/sbnd/export_pot_counter.sh
f_5 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/MCP2025B/srcs/sbnutil/scripts/sbnd/build_event_numbers.sh
f_9 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/MCP2025B/srcs/sbnutil/scripts/sbnd/rm_empty_files.sh

# Auto-release stuff.
lines_2                = '+FERMIHTC_AutoRelease=True'
lines_3                = '+FERMIHTC_GraceMemory=4000'
lines_4                = '+FERMIHTC_GraceLifetime=7200'

# Note the multifile=False key here. We'll need to switch that to True
[job_setup]
debug=True
find_setups=False
source_1=/cvmfs/%(experiment)s.opensciencegrid.org/products/%(experiment)s/setup_%(experiment)s.sh
setup_0=sbnutil
setup_1=%(exp_sw)s %(version)s -q %(quals)s
multifile=False
getconfig=False
ifdh_art=True
setup_local=True

# Convenience prescript so wrappers (that often live in CONDOR_DIR_INPUT) can be executed
prescript = export FHICL_FILE_PATH=${CONDOR_DIR_INPUT}:${FHICL_FILE_PATH}
# Block to setup prescripts for wrappers. 1 wrapper = 1 stage in the whole
# Only the first needs to be the metadata prescripts, as that exports the env-variables
# This will construct wrapper fcl files, to be executed sequentially.
# Also, explicitly override the process name to ensure the process is correct
prescript_1 = . ${CONDOR_DIR_INPUT}/metadata_prescripts.sh %(fclfile1)s %(wrapper1)s
prescript_2 = sh sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile2)s --wrappername %(wrapper2)s && echo -e "" >> %(wrapper2)s && echo -e "process_name: Reco1" >> %(wrapper2)s
prescript_3 = sh sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile3)s --wrappername %(wrapper3)s && echo -e "" >> %(wrapper3)s && echo -e "process_name: Reco2" >> %(wrapper3)s
prescript_4 = sh sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile4)s --wrappername %(wrapper4)s && echo -e "" >> %(wrapper4)s && echo -e "process_name: CAF" >> %(wrapper4)s

# best to run the metadata injector even if it doesn't do everything we want it to
prescript_5 = sh sbndpoms_metadata_injector.sh --inputfclname %(wrapper1)s --mdfclname %(fclfile1)s --mdappfamily art --mdappversion %(version)s --mdgroupname %(experiment)s --mdfiletype data --mdruntype physics --experiment %(experiment)s --mdprojectname %(project_name)s --mdprojectstage %(project_stage)s --mdprojectversion %(version)s --mdprojectsoftware %(experiment)scode --mdproductionname %(campaign)s --mdproductiontype %(prodtype)s --configuration ${MT_CONFIGURATION} --datastream ${MT_DATASTREAM} --beamType ${MT_BEAMTYPE} --detector ${MT_DETECTOR} --eventCount ${MT_EVENTCOUNT} --random ${MT_RANDOM} --randomRun ${MT_RANDOMRUN}

# Ensure some final things are set
prescript_6 = source /cvmfs/larsoft.opensciencegrid.org/products/setup
prescript_7 = setup ifdhc v2_7_2 -q e26:p3915:prof
prescript_8 = export MT_PRODUCTIONNAME=%(campaign)s && export MT_PRODUCTIONTYPE=%(prodtype)s && export MT_PROJECTNAME=%(project_name)s && export MT_PROJECTSTAGE=%(project_stage)s && export MT_PROJECTSOFTWARE=%(experiment)scode && export MT_PRODUCTIONLABEL=%(productionlabel)s
prescript_9 = export IFDH_OUTPUT_DIR=%(outbase)s && echo "IFDH_OUTPUT_DIR is ${IFDH_OUTPUT_DIR}"

# Dump environment
prescript_10 = echo && echo && ups active && echo && echo

# Postscripts that should always run.
# Edit -- keep empty files!!!!
#postscript_1 = . ${CONDOR_DIR_INPUT}/rm_empty_files.sh %(wrapper1)s
#postscript_2 = . ${CONDOR_DIR_INPUT}/rm_empty_files.sh %(wrapper2)s
postscript_3 = . ${CONDOR_DIR_INPUT}/build_event_numbers.sh %(project_stage)s
postscript_4 = ls -ltrh
postscript_5 = . ${CONDOR_DIR_INPUT}/metadata_postscripts_onestage.sh %(fcl_list)s

# For multifile processing, we'll need to increase the sam_consumer limit.
[sam_consumer]
limit=1
appvers=%(version)s
schema=root

# First executable -- echo.
# This will print a warning if not set in the stage.
[executable]
name=echo
arg_1="YOU HAVE NOT SET THE EXECUTABLE. GO FIX THIS IN THE [stage] BLOCK. I WILL EXIT NOW."

[executable_2]
name=echo
arg_1="YOU HAVE NOT SET THE EXECUTABLE 2. GO FIX THIS IN THE [stage] BLOCK. I WILL EXIT NOW."

[executable_3]
name=echo
arg_1="YOU HAVE NOT SET THE EXECUTABLE 3. GO FIX THIS IN THE [stage] BLOCK. I WILL EXIT NOW."

[executable_4]
name=echo
arg_1="YOU HAVE NOT SET THE EXECUTABLE 4. GO FIX THIS IN THE [stage] BLOCK. I WILL EXIT NOW."

[executable_5]
name=echo
arg_1="YOU HAVE NOT SET THE EXECUTABLE 5. GO FIX THIS IN THE [stage] BLOCK. I WILL EXIT NOW."

[executable_6]
name=echo
arg_1="YOU HAVE NOT SET THE EXECUTABLE 6. GO FIX THIS IN THE [stage] BLOCK. I WILL EXIT NOW."

[executable_7]
name=echo
arg_1="YOU HAVE NOT SET THE EXECUTABLE 7. GO FIX THIS IN THE [stage] BLOCK. I WILL EXIT NOW."

# I will also leave job_output empty here.
# You should set this in stage.
[job_output]
addoutput=
rename=
dest=%(outbase)s/%(basename)s
declare_metadata=True
metadata_extractor=json
add_location=True
hash=0
filter_metadata=rootout
filter_metadata_1=art.first_event
filter_metadata_2=art.last_event
add_to_dataset=_poms_task

[stage_decode_reco1_reco2_caf]
global.basename      = data
global.project_stage = decode_reco1_reco2_caf

# Leave addoutput empty, all the ifdh calls are handled in postscripts...
job_output.addoutput= 
job_output.metadata_extractor=json
job_output.rename=

# Add a couple more prescripts for pot and extra fcls
job_setup.prescript_11  = sh sbnpoms_wrapperfcl_maker.sh --fclname %(extrafclfile1)s --wrappername %(wrapperextra1)s && cat %(wrapperextra1)s
job_setup.prescript_12 = sh sbnpoms_wrapperfcl_maker.sh --fclname %(potfclfile)s --wrappername %(wrapperpot)s && cat %(wrapperpot)s

# First executable: we run the decoder
executable.name=lar
executable.arg_1=-c
executable.arg_2=%(wrapper1)s
executable.arg_3=-o
executable.arg_4=out1:%(basename)s_filtered_decoded.root
executable.arg_5=-o
executable.arg_6=out2:%(basename)s_%%ifb_choppy_decoded.root
executable.arg_7=-n
executable.arg_8=%(nevents)s

# Second executable: we run the DigitalNoiseEventFilter
executable_2.name=lar
executable_2.arg_1=-c
executable_2.arg_2=%(wrapperextra1)s
executable_2.arg_3=-o
executable_2.arg_4=digitalNoise_filtered_decoded.root
executable_2.arg_5=-s
executable_2.arg_6=%(basename)s_filtered_decoded.root

# Third executable: we run reco1
executable_3.name=lar
executable_3.arg_1=-c
executable_3.arg_2=%(wrapper2)s
executable_3.arg_3=-o
executable_3.arg_4=out1:%(basename)s_filtered_decoded_reco1.root
executable_3.arg_5=-o
executable_3.arg_6=out2:%(basename)s_filtered_decoded_nhit_fail.root
executable_3.arg_7=-s
executable_3.arg_8=digitalNoise_filtered_decoded.root
executable_3.arg_9=-n
executable_3.arg_10=%(nevents)s
executable_3.arg_11=--sam-data-tier=out2:reconstructed
executable_3.arg_12=--sam-stream-name=out2:unknown

# Larcv has no end_path module, so we can't configure it directly.
# Therefore, add another executable to handle renaming
# Fourth executable: we move larcv to the correct name
executable_4.name=mv
executable_4.arg_1=*larcv*.root
executable_4.arg_2=larcv_%(basename)s_filtered_decoded_reco1.root

# Fifth executable: we run the reco2
executable_5.name=lar
executable_5.arg_1=-c
executable_5.arg_2=%(wrapper3)s
executable_5.arg_3=-s
executable_5.arg_4=%(basename)s_filtered_decoded_reco1.root
executable_5.arg_5=-o
executable_5.arg_6=out1:to_count.root
executable_5.arg_7=-T
executable_5.arg_8=hist_%(basename)s_filtered_decoded_reco1_reco2.root

# Fifth executable: we run the POT module
executable_6.name=lar
executable_6.arg_1=-c
executable_6.arg_2=%(wrapperpot)s
executable_6.arg_3=-s
executable_6.arg_4=to_count.root
executable_6.arg_5=-o
executable_6.arg_6=%(basename)s_filtered_decoded_reco1_reco2.root

# Sixth executable: we run the caf
executable_7.name=lar
executable_7.arg_1=-c
executable_7.arg_2=%(wrapper4)s
executable_7.arg_3=-s
executable_7.arg_4=%(basename)s_filtered_decoded_reco1_reco2.root

# Also, don't forget to specify the fcl_list
global.fcl_list = %(fclfile1)s"/"%(extrafclfile1)s"/"%(fclfile2)s"/"%(fclfile3)s"/"%(potfclfile)s"/"%(fclfile4)s