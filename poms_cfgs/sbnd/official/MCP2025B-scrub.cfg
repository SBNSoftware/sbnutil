[global]
group      = sbnd
experiment = sbnd
sbndpro    = sbndpro
wrapper    = file:///${FIFE_UTILS_DIR}/libexec/fife_wrap
#wrapper    = file:///sbnd/app/users/vito/poms_cfg/fife_wrap
version    = v09_75_03
quals      = e20:prof

neventsperjob = -1

fclfile = override_me
wrapper1 = wrapper1.fcl
mdprojectstage = override_me

productionlabel        = MCP2025A
mdproductiontype       = official
productiontype         = mc
test_productiontype    = test_%(productiontype)s
mdproductionname       = %(productionlabel)s
test_mdproductionname  = test_%(productionlabel)s
sample                 = CV
mdlaststage            = override_me
fclname                = override_me
basename               = override_me
outputdataset          = %(productiontype)s_%(mdproductionname)s_%(fclname)s_%(sample)s
outputdatasetname      = %(outputdataset)s
base                   = /pnfs/sbn/data_add/sbn_nd/poms_production/
test_base              = /pnfs/sbn/scratch/users/sbndpro/poms_production/
basedir                = %(base)s/%(productiontype)s/%(productionlabel)s/%(version)s/%(fclname)s/%(sample)s/
outdir                 = %(basedir)s

[env_pass]
IFDH_CP_MAXRETRIES = 3
SAM_EXPERIMENT     = %(experiment)s
SAM_GROUP          = %(group)s
SAM_STATION        = %(experiment)s
XRD_CONNECTIONRETRY=32
XRD_REQUESTTIMEOUT =14400
XRD_REDIRECTLIMIT  =255
XRD_LOADBALANCERTTL=7200
XRD_STREAMTIMEOUT  =7200
#IFDH_VERSION       =v2_6_1


[prelaunch]
script = mkdir -p %(basedir)s

[submit]
group                      = %(group)s
role                       = production
resource-provides          = usage_model=OPPORTUNISTIC,DEDICATED
expected-lifetime          = 2h
memory                     = 2000MB
N                          = -1
n_files_per_job            = 1
append_condor_requirements = '(TARGET.HAS_CVMFS_sbnd_opensciencegrid_org==true)&&(TARGET.HAS_SINGULARITY=?=true)'
lines_1                    = '+SingularityImage=\"/cvmfs/singularity.opensciencegrid.org/fermilab/fnal-wn-sl7:latest\"'

[sam_consumer]
limit     = 1
schema    = root
appfamily = art
appname   = %(mdprojectstage)s
appvers   = %(version)s

[job_setup]
debug        = True
ifdh_art     = True
source       = /cvmfs/sbnd.opensciencegrid.org/products/sbnd/setup_sbnd.sh
setup_0      = sbndcode %(version)s -q %(quals)s
setup_1      = -t sbnutil

prescript_0  = printenv; ups active
prescript_1  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile)s --wrappername wrapper1.fcl

#postscript_1 = ifdh mkdir_p %(outdir)s
postscript_1 = ls -lh


[executable]
name   = lar
arg_1 = -c
arg_2 = wrapper1.fcl
arg_3  = -o
arg_4  = %(basename)s.root
arg_5  = -T
arg_6  = hist_%(basename)s.root
arg_7  = -n
arg_8  = %(neventsperjob)s
arg_9  = --sam-data-tier
arg_10 = scrub
arg_11 = --sam-stream-name
arg_12 = out1

[job_output]
addoutput          = %(basename)s.root
dest               = %(outdir)s/%(mdprojectstage)s/
declare_metadata   = True
metadata_extractor = sbnpoms_metadata_extractor.py
add_to_dataset     = %(outputdatasetname)s_%(basename)s_%(experiment)s
add_location       = True      
rename             = unique
hash               = 2
dataset_exclude    = hist*

[stage_scrub]
global.basename        = scrub
global.mdprojectstage  = scrub
global.mdlaststage     = scrub

submit.dataset         = %(dataset)s

job_setup.ifdh_art     = True
job_setup.multifile    = False
job_setup.getconfig    = False

job_setup.prescript_2  = sbnpoms_metadata_injector.sh --inputfclname wrapper1.fcl --mdfclname %(fclfile)s --mdprojectname %(fclname)s --mdprojectstage %(mdprojectstage)s --mdprojectversion %(version)s --mdprojectsoftware %(experiment)scode --mdproductionname %(mdproductionname)s --mdproductiontype %(mdproductiontype)s --mdappversion %(version)s --mdfiletype mc --mdappfamily art --mdruntype physics --mdgroupname %(group)s --tfilemdjsonname %(mdprojectstage)s.root.json --cafname %(mdprojectstage)s.root 
job_setup.prescript_3  = cat %(wrapper1)s

job_setup.postscript_2 = cat %(basename)s.root.json; cat %(mdprojectstage)s.root.json; cp %(mdprojectstage)s.root.json %(basename)s.flat.caf.root.json;
#job_setup.postscript_2 = mv reco2-*.flat.caf.root %(basename)s.flat.caf.root; cat %(mdprojectstage)s.root.json; cp %(mdprojectstage)s.root.json %(basename)s.flat.caf.root.json;
