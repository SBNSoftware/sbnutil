[global]
group      = sbnd
experiment = sbnd
sbndpro    = sbndpro
wrapper    = file:///${FIFE_UTILS_DIR}/libexec/fife_wrap
version    = v10_06_00_1001
quals      = e26:prof

neventsperjob = -1

# Six fcl files will be run for full processing.
fclfile1 = override_me # <-- gen fcl
fclfile2 = override_me # <-- g4 
fclfile3 = override_me # <-- detsim
fclfile4 = override_me # <-- reco1
fclfile5 = override_me # <-- reco2
fclfile6 = override_me # <-- caf

fcl_list = override_me # A list of all the fcls we ran.

wrapper1 = wrapper1.fcl
wrapper2 = wrapper2.fcl
wrapper3 = wrapper3.fcl
wrapper4 = wrapper4.fcl
wrapper5 = wrapper5.fcl
wrapper6 = wrapper6.fcl

productionlabel        = MCP2025C
mdprojectstage         = gen_g4_detsim_reco1_reco2_caf
mdproductiontype       = official
productiontype         = mc
test_productiontype    = test_%(productiontype)s
mdproductionname       = %(productionlabel)s
test_mdproductionname  = test_%(productionlabel)s
sample                 = CV
mdfirststage           = override_me
mdlaststage            = override_me
fclname                = override_me
basename               = %(mdproductiontype)s
outputdataset          = %(productiontype)s_%(mdproductionname)s_%(version)s_%(fclname)s_%(sample)s
outputdatasetname      = %(outputdataset)s
base                   = /pnfs/sbn/data_add/sbn_nd/poms_production/
test_base              = /pnfs/sbn/scratch/users/sbndpro/poms_production/
basedir                = %(base)s/%(productiontype)s/%(productionlabel)s/%(version)s/%(fclname)s/%(sample)s/
outdir                 = %(basedir)s
project_name           = FakeDatasets

# Adding GENIE tune and tag used to run
genie_tune             = AR2520i00000
genie_tag              = v3_06_02_sbn3
genie_xsec_tag         = v3_06_02_sbn2
# And the nusystematics qualifier
nusystematics_tag      = v1_05_07
nusystematics_qual     = e26:sbn3:prof

# Declare base dataset -- we'll add stream name and software version in add_output
sam_dataset=override_me

[env_pass]
SAM_EXPERIMENT     = %(experiment)s
SAM_GROUP          = %(group)s
SAM_STATION        = %(experiment)s
XRD_CONNECTIONRETRY=32
XRD_REQUESTTIMEOUT =14400
XRD_REDIRECTLIMIT  =255
XRD_LOADBALANCERTTL=7200
XRD_STREAMTIMEOUT  =7200
IFDH_CP_MAXRETRIES = 3
IFDH_DEBUG         = 1
#IFDH_VERSION       =v2_6_1
#IFDH_BASE_URI=https://samweb.fnal.gov:8483/sam/${EXPERIMENT}/api

[prelaunch]
script = mkdir -p %(basedir)s

[submit]
group                      = %(group)s
subgroup                   = standard
role                       = production
resource-provides          = usage_model=OPPORTUNISTIC,DEDICATED
expected-lifetime          = 2h
memory                     = 2000MB
N                          = -1
n_files_per_job            = 1 
append_condor_requirements = '(TARGET.HAS_CVMFS_sbnd_opensciencegrid_org==true)&&(TARGET.HAS_SINGULARITY=?=true)'
lines_1                    = '+SingularityImage=\"/cvmfs/singularity.opensciencegrid.org/fermilab/fnal-wn-sl7:latest\"'
lines_2                    = '+FERMIHTC_AutoRelease=True'
lines_3                    = '+FERMIHTC_GraceMemory=6000'
lines_4                    = '+FERMIHTC_GraceLifetime=3600'

blacklist                  = SLATE_US_NMSU_DISCOVERY,RAL
cpu                        = 1

# set a safety to not overload the grid
maxConcurrent = 2000

# These are necessary files, we get from app.
# Should work to get these from sbnutil once the PR is merged...
f_1 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/SBND2026B_Ar25/srcs/sbnutil/scripts/sbnd/metadata_prescripts.sh
f_2 = dropbox:///exp/sbnd/app/users/sbndpro/mcp/SBND2026B_Ar25/srcs/sbnutil/scripts/sbnd/metadata_postscripts_MC_onestage.sh

[sam_consumer]
limit     = 1
schema    = root
appfamily = art
appname   = %(mdprojectstage)s
appvers   = %(version)s

# In [job_setup], we define the prescripts to be run.
# These will control necessary setups, as well as key variables for metadata.
# If in doubt, reach out to Mateus or John via DM or #sbnd_inner_production_group

[job_setup]
debug        = True
ifdh_art     = True
source       = /cvmfs/sbnd.opensciencegrid.org/products/sbnd/setup_sbnd.sh
setup_0      = sbndcode %(version)s -q %(quals)s
setup_1	     = -t sbnutil

prescript   = source /cvmfs/sbnd.opensciencegrid.org/products/sbnd/setup_sbnd.sh && export PRODUCTS=/cvmfs/sbn.opensciencegrid.org/products/sbn:${PRODUCTS}
# Commence the Frankenworkflow.
# Then we unsetup genie, and setup the correct tags of the lowest level (generation)
prescript_1 = unsetup genie && unsetup genie_xsec && unsetup lhapdf && unsetup pythia8 && unsetup hepmc3 && unsetup dk2nugenie && unsetup nugen && unsetup nusystematics
prescript_2 = setup nusystematics %(nusystematics_tag)s -q %(nusystematics_qual)s && setup genie_xsec %(genie_xsec_tag)s -q %(genie_tune)s:e1000:k250
prescript_3 = ups active
# Add CONDOR_DIR_INPUT to the FHICL_FILE_PATH and export the WORKDIR
prescript_4 = export FHICL_FILE_PATH=${CONDOR_DIR_INPUT}:${FHICL_FILE_PATH} && export WORKDIR=${PWD} && export FHICL_FILE_PATH=${WORKDIR}:${FHICL_FILE_PATH}

# These next prescripts ensure we get key environmental variables
# The main one this script populates for MC is the parent file (i.e. the input fcl)
prescript_5 = . ${CONDOR_DIR_INPUT}/metadata_prescripts.sh %(fclfile1)s %(wrapper1)s
# For the other important variables, we'll extract these from the fcl
prescript_6 = export MT_PRODUCTIONNAME=%(sample)s && export MT_PRODUCTIONTYPE=%(productiontype)s && export MT_PROJECTNAME=%(mdproductionname)s && export MT_PROJECTSTAGE=%(mdprojectstage)s && export MT_PROJECTSOFTWARE=sbndcode && export MT_PRODUCTIONLABEL=%(productionlabel)s && export MT_GENIE_TAG=%(genie_tag)s && export MT_GENIE_TUNE=%(genie_tune)s && export MT_EVENTS_PER_JOB=%(neventsperjob)s && export MT_SAMPLE=%(sample)s && export MT_FCLNAME=%(fclname)s
prescript_7 = export IFDH_OUTPUT_DIR=%(basedir)s && echo "IFDH_OUTPUT_DIR is ${IFDH_OUTPUT_DIR}"

# For all the other executables apart from gen, make an appropriate wrapper
# The reason is, we just execute the gen straight on the input dataset (which is initial fcl files)
prescript_8  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile2)s --wrappername wrapper2.fcl
prescript_9  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile3)s --wrappername wrapper3.fcl
prescript_10  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile4)s --wrappername wrapper4.fcl
prescript_11  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile5)s --wrappername wrapper5.fcl
prescript_12  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile6)s --wrappername wrapper6.fcl

# And a metadata injection on the final fcl
prescript_13   = sbnpoms_metadata_injector.sh --inputfclname wrapper6.fcl --mdappfamily art --mdappversion %(version)s --mdgroupname sbnd --mdfiletype mc --mdruntype physics --mdfclname %(fclfile1)s/%(fclfile2)s/%(fclfile3)s/%(fclfile4)s/%(fclfile5)s/%(fclfile6)s --mdprojectname %(project_name)s --mdprojectstage %(mdprojectstage)s --mdprojectversion %(version)s --mdprojectsoftware sbndcode --mdproductionname %(mdproductionname)s --mdproductiontype %(mdproductiontype)s --tfilemdjsonname hist_%(mdprojectstage)s.root.json --cafname %(mdlaststage)s.root

# Ensure we are declaring directly to SBN SAM.
# NB: This prescript will break declarations because initialfcls are not declared to SBN SAM. TODO, probably..
# prescript_14   = export SAM_EXPERIMENT=sbn

# Postscripts are run after all the executables are finished.
postscript = ls -ltrh
# All the work on metadata is done here, as well as ifdh calls to the target dirs
postscript_1 = . ${CONDOR_DIR_INPUT}/metadata_postscripts_MC_onestage.sh %(fcl_list)s

# First executable -- echo.
# This will print a warning if not set in the stage.

[executable]
name=echo
arg_1="YOU HAVE NOT SET THE EXECUTABLE 1. GO FIX THIS IN THE [stage] BLOCK. I WILL EXIT NOW."

[executable_1]
name=echo
arg_1="YOU HAVE NOT SET THE EXECUTABLE 2. GO FIX THIS IN THE [stage] BLOCK. I WILL EXIT NOW."

[executable_2]
name=echo
arg_1="YOU HAVE NOT SET THE EXECUTABLE 3. GO FIX THIS IN THE [stage] BLOCK. I WILL EXIT NOW."

[executable_3]
name=echo
arg_1="YOU HAVE NOT SET THE EXECUTABLE 4. GO FIX THIS IN THE [stage] BLOCK. I WILL EXIT NOW."

[executable_4]
name=echo
arg_1="YOU HAVE NOT SET THE EXECUTABLE 5. GO FIX THIS IN THE [stage] BLOCK. I WILL EXIT NOW."

[executable_5]
name=echo
arg_1="YOU HAVE NOT SET THE EXECUTABLE 6. GO FIX THIS IN THE [stage] BLOCK. I WILL EXIT NOW."

[executable_6]
name=echo
arg_1="YOU HAVE NOT SET THE EXECUTABLE 7. GO FIX THIS IN THE [stage] BLOCK. I WILL EXIT NOW."

# I will also leave job_output empty here.
# You should set this in stage.
[job_output]
addoutput=
rename=
dest=%(basedir)s/%(basename)s
declare_metadata=True
metadata_extractor=json
add_location=True
hash=0
filter_metadata=rootout
filter_metadata_1=art.first_event
filter_metadata_2=art.last_event
add_to_dataset=_poms_task

[stage_gen_g4_detsim_reco1_reco2_caf]
global.basename      = official
global.mdprojectstage = gen_g4_detsim_reco1_reco2_caf
global.mdfirststage  = gen
global.mdlaststage   = caf

# Leave addoutput empty, all the ifdh calls are handled in postscripts...
job_output.addoutput= 
job_output.metadata_extractor=json
job_output.rename=

# First executable: we run the generation fcl
executable_1.name=lar
executable_1.arg_1=-c
executable_1.arg_2=initial.fcl
executable_1.arg_3=-o
executable_1.arg_4=%(mdfirststage)s.root
executable_1.arg_5=-T
executable_1.arg_6=hist_%(mdfirststage)s.root
executable_1.arg_7=-n
executable_1.arg_8=%(neventsperjob)s
#executable_1.arg_9=--sam-data-tier
#executable_1.arg_10=simulation
#executable_1.arg_11=--sam-stream-name
#executable_1.arg_12=out1

# Second executable: we run G4 on the event record
executable_2.name=lar
executable_2.arg_1=-c
executable_2.arg_2=wrapper2.fcl
executable_2.arg_3=-o
executable_2.arg_4=%(mdfirststage)s_g4.root
executable_2.arg_5=-T
executable_2.arg_6=hist_%(mdfirststage)s_g4.root
executable_2.arg_7=-n
executable_2.arg_8=-1
executable_2.arg_9=--sam-data-tier
executable_2.arg_10=simulated
executable_2.arg_11=--sam-stream-name
executable_2.arg_12=out1
executable_2.arg_13=-s
executable_2.arg_14=%(mdfirststage)s.root

# Third executable: we run detector simulation on the particles
executable_3.name=lar
executable_3.arg_1=-c
executable_3.arg_2=wrapper3.fcl
executable_3.arg_3=-o
executable_3.arg_4=%(mdfirststage)s_g4_detsim.root
executable_3.arg_5=-T
executable_3.arg_6=hist_%(mdfirststage)s_g4_detsim.root
executable_3.arg_7=-n
executable_3.arg_8=-1
executable_3.arg_9=--sam-data-tier
executable_3.arg_10=detector-simulated
executable_3.arg_11=--sam-stream-name
executable_3.arg_12=out1
executable_3.arg_13=-s
executable_3.arg_14=%(mdfirststage)s_g4.root

# Fourth executable: we run low-level reconstruction on the particles
executable_4.name=lar
executable_4.arg_1=-c
executable_4.arg_2=wrapper4.fcl
executable_4.arg_3=-o
executable_4.arg_4=%(mdfirststage)s_g4_detsim_reco1.root
executable_4.arg_5=-T
executable_4.arg_6=hist_%(mdfirststage)s_g4_detsim_reco1.root
executable_4.arg_7=-n
executable_4.arg_8=-1
executable_4.arg_9=--sam-data-tier
executable_4.arg_10=reconstructed
executable_4.arg_11=--sam-stream-name
executable_4.arg_12=out1
executable_4.arg_13=-s
executable_4.arg_14=%(mdfirststage)s_g4_detsim.root

# Fifth executable: we run high-level reconstruction on the low-level reconstruction
executable_5.name=lar
executable_5.arg_1=-c
executable_5.arg_2=wrapper5.fcl
executable_5.arg_3=-o
executable_5.arg_4=%(mdfirststage)s_g4_detsim_reco1_reco2.root
executable_5.arg_5=-T
executable_5.arg_6=hist_%(mdfirststage)s_g4_detsim_reco1_reco2.root
executable_5.arg_7=-n
executable_5.arg_8=-1
executable_5.arg_9=--sam-data-tier
executable_5.arg_10=reconstructed
executable_5.arg_11=--sam-stream-name
executable_5.arg_12=out1
executable_5.arg_13=-s
executable_5.arg_14=%(mdfirststage)s_g4_detsim_reco1.root

# Sixth executable: we run CAFMaker on the reco2
executable_6.name=lar
executable_6.arg_1=-c
executable_6.arg_2=wrapper6.fcl
executable_6.arg_3=-n
executable_6.arg_4=-1
executable_6.arg_5=--sam-data-tier
executable_6.arg_6=reconstructed
executable_6.arg_7=--sam-stream-name
executable_6.arg_8=out1
executable_6.arg_9=-s
executable_6.arg_10=%(mdfirststage)s_g4_detsim_reco1_reco2.root

global.fcl_list = %(fclfile1)s/%(fclfile2)s/%(fclfile3)s/%(fclfile4)s/%(fclfile5)s/%(fclfile6)s
