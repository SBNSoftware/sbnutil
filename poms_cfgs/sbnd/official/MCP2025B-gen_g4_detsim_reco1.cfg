[global]
group      = sbnd
experiment = sbnd
sbndpro    = sbndpro
wrapper    = file:///${FIFE_UTILS_DIR}/libexec/fife_wrap
version    = v09_91_02_01
quals      = e26:prof

neventsperjob = -1

fclfile1 = override_me
fclfile2 = override_me
fclfile3 = override_me
fclfile4 = override_me
fclfile5 = override_me

wrapper1 = wrapper1.fcl
wrapper2 = wrapper2.fcl
wrapper3 = wrapper3.fcl
wrapper4 = wrapper4.fcl
wrapper5 = wrapper5.fcl

productionlabel        = MCP2025A
mdproductiontype       = official
productiontype         = mc
test_productiontype    = test_%(productiontype)s
mdproductionname       = %(productionlabel)s
test_mdproductionname  = test_%(productionlabel)s
sample                 = CV
mdlaststage            = override_me
fclname                = override_me
basename               = override_me
outputdataset          = %(productiontype)s_%(mdproductionname)s_%(fclname)s_%(sample)s
outputdatasetname      = %(outputdataset)s
base                   = /pnfs/sbn/data_add/sbn_nd/poms_production/
test_base              = /pnfs/sbn/scratch/users/sbndpro/poms_production/
basedir                = %(base)s/%(productiontype)s/%(productionlabel)s/%(version)s/%(fclname)s/%(sample)s/
outdir                 = %(basedir)s
project_name           = FullProcessing

[env_pass]
SAM_EXPERIMENT     = %(experiment)s
SAM_GROUP          = %(group)s
SAM_STATION        = %(experiment)s
XRD_CONNECTIONRETRY=32
XRD_REQUESTTIMEOUT =14400
XRD_REDIRECTLIMIT  =255
XRD_LOADBALANCERTTL=7200
XRD_STREAMTIMEOUT  =7200
IFDH_CP_MAXRETRIES = 3
IFDH_DEBUG         = 1
#IFDH_VERSION       =v2_6_1
#IFDH_BASE_URI=https://samweb.fnal.gov:8483/sam/${EXPERIMENT}/api

#new flux variable
#GDK2NUFLUXXML=/cvmfs/sbnd.osgstorage.org/pnfs/fnal.gov/usr/sbnd/persistent/stash/fluxFiles/bnb/G4BNB/v1.1.0/GNuMIFlux.xml

[prelaunch]
script = mkdir -p %(basedir)s

[submit]
group                      = %(group)s
role                       = production
resource-provides          = usage_model=OPPORTUNISTIC,DEDICATED
expected-lifetime          = 2h
memory                     = 2000MB
N                          = -1
n_files_per_job            = 1 
append_condor_requirements = '(TARGET.HAS_CVMFS_sbnd_opensciencegrid_org==true)&&(TARGET.HAS_SINGULARITY=?=true)'
lines_1                    = '+SingularityImage=\"/cvmfs/singularity.opensciencegrid.org/fermilab/fnal-wn-sl7:latest\"'
lines_2                    = '+FERMIHTC_AutoRelease=True'
lines_3                    = '+FERMIHTC_GraceMemory=6000'
#lines_4                    = '+FERMIHTC_GraceLifetime=3600'

blacklist                  = SLATE_US_NMSU_DISCOVERY,RAL
#cpu                        = 2
cpu                        = 1

[sam_consumer]
limit     = 1
schema    = root
appfamily = art
appname   = %(mdprojectstage)s
appvers   = %(version)s

[job_setup]
debug        = True
ifdh_art     = True
source       = /cvmfs/sbnd.opensciencegrid.org/products/sbnd/setup_sbnd.sh
setup_0      = sbndcode %(version)s -q %(quals)s
setup_1	     = -t sbnutil

prescript  = printenv; ups active
prescript_1  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile2)s --wrappername wrapper2.fcl
prescript_2  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile3)s --wrappername wrapper3.fcl
prescript_3  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile4)s --wrappername wrapper4.fcl
prescript_4  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile5)s --wrappername wrapper5.fcl

#postscript_1 = ifdh mkdir_p %(outdir)s
postscript_1 = ls -lh


[executable]
name   = lar
#arg_1 = -c
#arg_2 = wrapper1.fcl
arg_3  = -o
arg_4  = %(basename)s.root
arg_5  = -T
arg_6  = hist_%(basename)s.root
arg_7  = -n
arg_8  = %(neventsperjob)s
arg_9  = --sam-data-tier
arg_10 = simulation
arg_11 = --sam-stream-name
arg_12 = out1

[executable_1]
name   = lar
arg_1  = -c
arg_2  = wrapper2.fcl
arg_3  = -o
arg_4  = %(basename)s_g4.root
arg_5  = -T
arg_6  = hist_%(basename)s_g4.root
arg_7  = -n
arg_8  = -1
arg_9  = --sam-data-tier
arg_10 = reconstructed
arg_11 = --sam-stream-name
arg_12 = out1
arg_13 = -s
arg_14 = %(basename)s.root

[executable_2]
name   = lar
arg_1  = -c
arg_2  = wrapper3.fcl
arg_3  = -o
#arg_4  = %(basename)s_g4_wcsim.root
arg_4  = %(basename)s_g4_detsim.root
arg_5  = -T
#arg_6  = hist_%(basename)s_g4_wcsim.root
arg_6  = hist_%(basename)s_g4_detsim.root
arg_7  = -n
arg_8  = -1
arg_9  = --sam-data-tier
arg_10 = reconstructed
arg_11 = --sam-stream-name
arg_12 = out1
arg_13 = -s
arg_14 = %(basename)s_g4.root
#arg_15 = --nthreads
#arg_16 = 2

[executable_3]
name   = lar
arg_1  = -c
arg_2  = wrapper4.fcl
arg_3  = -o
#arg_4  = %(basename)s_g4_wcsim_detsim.root
arg_4  = %(mdprojectstage)s.root
arg_5  = -T
#arg_6  = hist_%(basename)s_g4_wcsim_detsim.root
arg_6  = hist_%(mdprojectstage)s.root
arg_7  = -n
arg_8  = -1
arg_9  = --sam-data-tier
arg_10 = reconstructed
arg_11 = --sam-stream-name
arg_12 = out1
arg_13 = -s
#arg_14 = %(basename)s_g4_wcsim.root
arg_14 = %(basename)s_g4_detsim.root

#[executable_4]
#name   = lar
#arg_1  = -c
#arg_2  = wrapper5.fcl
#arg_3  = -o
#arg_4  = %(mdprojectstage)s.root
#arg_5  = -T
#arg_6  = hist_%(mdprojectstage)s.root
#arg_7  = -n
#arg_8  = -1
#arg_9  = --sam-data-tier
#arg_10 = reconstructed
#arg_11 = --sam-stream-name
#arg_12 = out1
#arg_13 = -s
#arg_14 = %(basename)s_g4_wcsim_detsim.root

[job_output]
addoutput          = %(mdprojectstage)s.root
dest               = %(outdir)s/%(mdprojectstage)s/
declare_metadata   = True
metadata_extractor = sbnpoms_metadata_extractor.py
add_to_dataset     = %(outputdatasetname)s_%(mdprojectstage)s_%(experiment)s
add_location       = True      
rename             = unique
hash               = 2
dataset_exclude    = hist*

[job_output_1]
addoutput          = %(basename)s_g4_detsim.root
dest               = %(outdir)s/detsim/
declare_metadata   = True
metadata_extractor = sbnpoms_metadata_extractor.py
add_to_dataset     = %(outputdatasetname)s_gen_g4_detsim_%(experiment)s
add_location       = True       
rename             = unique
hash               = 2

[job_output_2]
addoutput          = *larcv*.root
dest               = %(outdir)s/larcv/
declare_metadata   = True
metadata_extractor = sbnpoms_metadata_extractor.py
add_to_dataset     = %(outputdatasetname)s_%(mdprojectstage)s_larcv_%(experiment)s
add_location       = True      
rename             = unique
hash               = 2
dataset_exclude    = hist*

[stage_gen_g4_detsim_reco1]
global.basename        = gen
global.mdprojectstage  = gen_g4_detsim_reco1
global.mdlaststage     = reco1

submit.dataset         = %(dataset)s

job_setup.ifdh_art     = False
job_setup.multifile    = False
job_setup.getconfig    = True

#job_setup.prescript_5  = sbnpoms_metadata_injector.sh --inputfclname wrapper5.fcl --mdappfamily art --mdappversion %(version)s --mdgroupname sbnd --mdfiletype mc --mdruntype physics --mdfclname %(fclfile2)s/%(fclfile3)s/%(fclfile4)s/%(fclfile5)s --mdprojectname %(fclname)s --mdprojectstage reco1 --mdprojectversion %(version)s --mdprojectsoftware sbndcode --mdproductionname %(mdproductionname)s --mdproductiontype %(mdproductiontype)s --tfilemdjsonname hist_%(mdprojectstage)s.root.json
#job_setup.prescript_5  = sbnpoms_metadata_injector.sh --inputfclname wrapper4.fcl --mdappfamily art --mdappversion %(version)s --mdgroupname sbnd --mdfiletype mc --mdruntype physics --mdfclname %(fclfile2)s/%(fclfile3)s/%(fclfile4)s --mdprojectname %(fclname)s --mdprojectstage reco1 --mdprojectversion %(version)s --mdprojectsoftware sbndcode --mdproductionname %(mdproductionname)s --mdproductiontype %(mdproductiontype)s --tfilemdjsonname hist_%(mdprojectstage)s.root.json
job_setup.prescript_5  = sbnpoms_metadata_injector.sh --inputfclname wrapper4.fcl --mdappfamily art --mdappversion %(version)s --mdgroupname sbnd --mdfiletype mc --mdruntype physics --mdfclname %(fclfile2)s/%(fclfile3)s/%(fclfile4)s --mdprojectname %(project_name)s --mdprojectstage reco1 --mdprojectversion %(version)s --mdprojectsoftware sbndcode --mdproductionname %(mdproductionname)s --mdproductiontype %(mdproductiontype)s --tfilemdjsonname hist_%(mdprojectstage)s.root.json
job_setup.prescript_6  = cat %(wrapper2)s
job_setup.prescript_7  = cat %(wrapper3)s
job_setup.prescript_8  = cat %(wrapper4)s

job_setup.postscript_2 = cat %(mdprojectstage)s.root.json hist_%(mdprojectstage)s.root.json
