[global]
group      = sbnd
experiment = sbnd
sbndpro    = sbndpro
wrapper    = file:///${FIFE_UTILS_DIR}/libexec/fife_wrap
version    = v09_91_02_01
quals      = e26:prof

neventsperjob = -1

fclfile1 = override_me
fclfile2 = override_me
fclfile3 = override_me
fclfile4 = override_me
fclfile5 = override_me
fclfile6 = override_me

wrapper1 = wrapper1.fcl
wrapper2 = wrapper2.fcl
wrapper3 = wrapper3.fcl
wrapper4 = wrapper4.fcl
wrapper5 = wrapper5.fcl
wrapper6 = wrapper6.fcl

productionlabel        = MCP2025A
mdproductiontype       = official
productiontype         = mc
test_productiontype    = test_%(productiontype)s
mdproductionname       = %(productionlabel)s
test_mdproductionname  = test_%(productionlabel)s
sample                 = CV
mdlaststage            = override_me
fclname                = override_me
basename               = override_me
outputdataset          = %(productiontype)s_%(mdproductionname)s_%(version)s_%(fclname)s_%(sample)s
outputdatasetname      = %(outputdataset)s
base                   = /pnfs/sbn/data_add/sbn_nd/poms_production/
test_base              = /pnfs/sbn/scratch/users/sbndpro/poms_production/
basedir                = %(base)s/%(productiontype)s/%(productionlabel)s/%(version)s/%(fclname)s/%(sample)s/
outdir                 = %(basedir)s
project_name           = FullProcessing

[env_pass]
SAM_EXPERIMENT     = %(experiment)s
SAM_GROUP          = %(group)s
SAM_STATION        = %(experiment)s
XRD_CONNECTIONRETRY=32
XRD_REQUESTTIMEOUT =14400
XRD_REDIRECTLIMIT  =255
XRD_LOADBALANCERTTL=7200
XRD_STREAMTIMEOUT  =7200
IFDH_CP_MAXRETRIES = 3
IFDH_DEBUG         = 1
#IFDH_VERSION       =v2_6_1
#IFDH_BASE_URI=https://samweb.fnal.gov:8483/sam/${EXPERIMENT}/api

[prelaunch]
script = mkdir -p %(basedir)s

[submit]
group                      = %(group)s
role                       = production
resource-provides          = usage_model=OPPORTUNISTIC,DEDICATED,OFFSITE 
expected-lifetime          = 2h
memory                     = 2000MB
N                          = -1
n_files_per_job            = 1 
append_condor_requirements = '(TARGET.HAS_CVMFS_sbnd_opensciencegrid_org==true)&&(TARGET.HAS_SINGULARITY=?=true)'
lines_1                    = '+SingularityImage=\"/cvmfs/singularity.opensciencegrid.org/fermilab/fnal-wn-sl7:latest\"'
lines_2                    = '+FERMIHTC_AutoRelease=True'
lines_3                    = '+FERMIHTC_GraceMemory=6000'
lines_4                    = '+FERMIHTC_GraceLifetime=3600'

blacklist                  = SLATE_US_NMSU_DISCOVERY,RAL
#cpu                        = 2
cpu                        = 1

[sam_consumer]
limit     = 1
schema    = root
appfamily = art
appname   = %(mdprojectstage)s
appvers   = %(version)s

[job_setup]
debug        = True
ifdh_art     = True
source       = /cvmfs/sbnd.opensciencegrid.org/products/sbnd/setup_sbnd.sh
setup_0      = sbndcode %(version)s -q %(quals)s
setup_1	     = -t sbnutil

prescript  = printenv; ups active
prescript_1  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile2)s --wrappername wrapper2.fcl
prescript_2  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile3)s --wrappername wrapper3.fcl
prescript_3  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile4)s --wrappername wrapper4.fcl
prescript_4  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile5)s --wrappername wrapper5.fcl
prescript_5  = sbnpoms_wrapperfcl_maker.sh --fclname %(fclfile6)s --wrappername wrapper6.fcl

#postscript_1 = ifdh mkdir_p %(outdir)s
postscript_1 = ls -lh

[executable] #gen
name   = lar
#arg_1 = -c
#arg_2 = wrapper1.fcl
arg_3  = -o
arg_4  = %(basename)s.root
arg_5  = -T
arg_6  = hist_%(basename)s.root
arg_7  = -n
arg_8  = %(neventsperjob)s
arg_9  = --sam-data-tier
arg_10 = simulation
arg_11 = --sam-stream-name
arg_12 = out1

[executable_1] #g4
name   = lar
arg_1  = -c
arg_2  = wrapper2.fcl
arg_3  = -o
arg_4  = g4.root
arg_5  = -T
arg_6  = hist_g4.root
arg_7  = -n
arg_8  = -1
arg_9  = --sam-data-tier
arg_10 = reconstructed
arg_11 = --sam-stream-name
arg_12 = out1
arg_13 = -s
arg_14 = %(basename)s.root

[executable_2] #detsim
name   = lar
arg_1  = -c
arg_2  = wrapper3.fcl
arg_3  = -o
arg_4  = detsim.root
arg_5  = -T
arg_6  = hist_detsim.root
arg_7  = -n
arg_8  = -1
arg_9  = --sam-data-tier
arg_10 = reconstructed
arg_11 = --sam-stream-name
arg_12 = out1
arg_13 = -s
arg_14 = g4.root
#arg_15 = --nthreads
#arg_16 = 2

[executable_3] #reco1
name   = lar
arg_1  = -c
arg_2  = wrapper4.fcl
arg_3  = -o
arg_4  = reco1.root
arg_5  = -T
arg_6  = hist_reco1.root
arg_7  = -n
arg_8  = -1
arg_9  = --sam-data-tier
arg_10 = reconstructed
arg_11 = --sam-stream-name
arg_12 = out1
arg_13 = -s
arg_14 = detsim.root

[executable_4] #reco2
name   = lar
arg_1  = -c
arg_2  = wrapper5.fcl
arg_3  = -o
arg_4  = reco2.root
arg_5  = -T
arg_6  = hist_reco2.root
arg_7  = -n
arg_8  = -1
arg_9  = --sam-data-tier
arg_10 = reconstructed
arg_11 = --sam-stream-name
arg_12 = out1
arg_13 = -s
arg_14 = reco1.root

[executable_5] #caf
name   = lar
arg_1  = -c
arg_2  = wrapper6.fcl
arg_3  = -o
arg_4  = %(mdlaststage)s.root
arg_5  = -T
arg_6  = hist_%(mdlaststage)s.root
arg_7  = -n
arg_8  = -1
arg_9  = --sam-data-tier
arg_10 = reconstructed
arg_11 = --sam-stream-name
arg_12 = out1
arg_13 = -s
arg_14 = reco2.root

[job_output] #reco1
addoutput          = reco1.root
dest               = %(outdir)s/reco1/
declare_metadata   = True
metadata_extractor = sbnpoms_metadata_extractor.py
add_to_dataset     = %(outputdatasetname)s_reco1_%(experiment)s
add_location       = True      
rename             = unique
hash               = 2
dataset_exclude    = hist*

[job_output_1] #detsim
addoutput          = detsim.root
dest               = %(outdir)s/detsim/
declare_metadata   = True
metadata_extractor = sbnpoms_metadata_extractor.py
add_to_dataset     = %(outputdatasetname)s_detsim_%(experiment)s
add_location       = True       
rename             = unique
hash               = 2
dataset_exclude    = hist*

[job_output_2] #larcv
addoutput          = *larcv*.root
dest               = %(outdir)s/larcv/
declare_metadata   = True
metadata_extractor = sbnpoms_metadata_extractor.py
add_to_dataset     = %(outputdatasetname)s_reco1_larcv_%(experiment)s
add_location       = True      
rename             = unique
hash               = 2
dataset_exclude    = hist*

[job_output_3] #reco2
addoutput          = reco2.root
dest               = %(outdir)s/reco2/
declare_metadata   = True
metadata_extractor = sbnpoms_metadata_extractor.py
add_to_dataset     = %(outputdatasetname)s_reco2_%(experiment)s
add_location       = True      
rename             = unique
hash               = 2
dataset_exclude    = hist*

[job_output_4] #calib ntuple
addoutput          = hist_reco2.root
dest               = %(outdir)s/calibntuple/
declare_metadata   = True
metadata_extractor = sbnpoms_metadata_extractor.py
add_to_dataset     = %(outputdatasetname)s_reco2_calibntuple_%(experiment)s
add_location       = True      
rename             = unique
hash               = 2

[job_output_5] #caf
addoutput          = %(mdlaststage)s.root
dest               = %(outdir)s/%(mdlaststage)s/
declare_metadata   = True
metadata_extractor = json
add_to_dataset     = %(outputdatasetname)s_%(mdlaststage)s_%(experiment)s
add_location       = True       
rename             = unique
hash               = 2

[job_output_6] #flat caf
addoutput          = %(mdlaststage)s.flat.caf.root
dest               = %(outdir)s/%(mdlaststage)s/
declare_metadata   = True
metadata_extractor = json
add_to_dataset     = %(outputdatasetname)s_%(mdlaststage)s_flatcaf_%(experiment)s
add_location       = True       
rename             = unique
hash               = 2

[stage_gen_g4_detsim_reco1_reco2_caf]
global.basename        = gen
global.mdprojectstage  = gen_g4_detsim_reco1_reco2_caf
global.mdlaststage     = caf

#submit.dataset         = %(dataset)s
submit.dataset         = official_MCP2025C_FallValidationII_prodgenie_corsika_proton_rockbox0p1_sbnd_v10_14_00_initialfcl_sbnd

job_setup.ifdh_art     = True
job_setup.multifile    = False
job_setup.getconfig    = True

job_setup.prescript_6   = sbnpoms_metadata_injector.sh --inputfclname wrapper6.fcl --mdappfamily art --mdappversion %(version)s --mdgroupname sbnd --mdfiletype mc --mdruntype physics --mdfclname %(fclfile2)s/%(fclfile3)s/%(fclfile4)s/%(fclfile5)s/%(fclfile6)s --mdprojectname %(project_name)s --mdprojectstage %(mdprojectstage)s --mdprojectversion %(version)s --mdprojectsoftware sbndcode --mdproductionname %(mdproductionname)s --mdproductiontype %(mdproductiontype)s --tfilemdjsonname hist_%(mdprojectstage)s.root.json --cafname %(mdlaststage)s.root 
job_setup.prescript_7   = cat %(wrapper2)s
job_setup.prescript_8   = cat %(wrapper3)s
job_setup.prescript_9   = cat %(wrapper4)s
job_setup.prescript_10  = cat %(wrapper5)s
job_setup.prescript_11  = cat %(wrapper6)s

job_setup.postscript_2 = cat reco1.root.json hist_reco1.root.json
job_setup.postscript_3 = cat reco2.root.json hist_reco2.root.json reco2.root.json
job_setup.postscript_4 = mv *.flat.caf.root caf.flat.caf.root; cat caf.root.json; cp caf.root.json caf.flat.caf.root.json;
